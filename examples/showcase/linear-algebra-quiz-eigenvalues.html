.als-menu { position: relative; }

/* Blueprint: maths, physics, CS, engineering.
   Inspired by the look of tailwindcss.com: near-black / white, sky accent, Inter + mono labels,
   hairline grid lines, dark code blocks, pill-shaped primary buttons. Colour values come from the
   MIT-licensed Tailwind palette (gray, sky, indigo, emerald, rose, amber). */

[data-als-theme="blueprint"] {
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --font-features: "cv11", "ss01";

  --display-tracking: -0.03em;
  --kicker-tracking: .12em;
  --radius: .75rem;
  --radius-sm: .5rem;
  --radius-btn: 999px;

  --bg: #ffffff;
  --bg-elev: #ffffff;
  --bg-sunken: #f9fafb;
  --text: #030712;
  --text-strong: #030712;
  --text-muted: #4b5563;
  --text-faint: #9ca3af;
  --border: rgb(3 7 18 / .08);
  --border-strong: rgb(3 7 18 / .16);
  --accent: #0284c7;
  --accent-hover: #0369a1;
  --accent-contrast: #ffffff;
  --accent-text: #0369a1;
  --accent-soft: rgb(14 165 233 / .12);
  --accent-2: #6366f1;
  --good: #059669;   --good-text: #047857;  --good-soft: rgb(16 185 129 / .12);
  --bad: #e11d48;    --bad-text: #be123c;   --bad-soft: rgb(244 63 94 / .10);
  --warn: #d97706;   --warn-text: #b45309;  --warn-soft: rgb(245 158 11 / .13);
  --shadow: 0 1px 2px rgb(3 7 18 / .05);
  --pattern:
    linear-gradient(to right, rgb(3 7 18 / .035) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(3 7 18 / .035) 1px, transparent 1px);
  --pattern-size: 40px 40px;

  --code-bg: #0f172a;
  --code-text: #e2e8f0;
  --code-keyword: #f472b6;
  --code-string: #7dd3fc;

}

/* Motif: primary actions are inverted pills, like the "Get started" button. */
[data-als-theme="blueprint"] .als-btn--primary { background: var(--text-strong); border-color: var(--text-strong); color: var(--bg); }

  .tr-order { list-style: none; padding: 0; margin: 0; display: grid; gap: .45rem; }

  .tr-settings label { display: block; font-size: .8125rem; color: var(--text-muted); margin-bottom: .35rem; }

<script type="application/json" id="als-data">{"als":"1","kind":"quiz","title":"Eigenvalues: practice set","subtitle":"Lecture 7 · 8 questions · mixed","module":"linear-algebra","subject":"Linear algebra","settings":{"mode":"practice","shuffle":true,"passMark":0.7,"timeLimitMin":25},"questions":[{"id":"q1","type":"mcq","topic":"eigen","difficulty":1,"src":"L7 s.22","prompt":"$A$ is a singular $3\\times 3$ matrix. Which of these is certainly an eigenvalue of $A$?","options":["$1$","$0$","$\\operatorname{tr} A$","None: singular matrices have no eigenvalues"],"answer":1,"hints":["What does singular mean for the equation $A\\mathbf v = \\mathbf 0$?"],"explain":"Singular means some $\\mathbf v \\neq \\mathbf 0$ has $A\\mathbf v = \\mathbf 0 = 0\\cdot\\mathbf v$, so $0$ is an eigenvalue. The trace is the *sum* of eigenvalues, not one of them."},{"id":"q2","type":"numeric","topic":"eigen","difficulty":2,"src":"L7 s.12","prompt":"What is the **largest** eigenvalue of $A = \\begin{pmatrix} 4 & 1 \\\\ 2 & 3 \\end{pmatrix}$?","answer":5,"tolerance":0.001,"hints":["Write down $\\det(A - \\lambda I)$.","You should get $\\lambda^2 - 7\\lambda + 10$."],"solution":["$\\det(A-\\lambda I) = (4-\\lambda)(3-\\lambda) - 2$.","$= \\lambda^2 - 7\\lambda + 10 = (\\lambda - 5)(\\lambda - 2)$.","The eigenvalues are $5$ and $2$, so the largest is $5$.","Check: $5 + 2 = 7 = \\operatorname{tr} A$ and $5\\cdot 2 = 10 = \\det A$."]},{"id":"q3","type":"multi","topic":"spectral","difficulty":2,"prompt":"Which statements hold for **every** real symmetric matrix?","options":["All eigenvalues are real.","Eigenvectors for distinct eigenvalues are orthogonal.","It is diagonalisable.","It is invertible."],"answer":[0,1,2],"explain":"The spectral theorem gives the first three. The zero matrix is symmetric but not invertible, so the last one fails.","grounded":false},{"id":"q4","type":"cloze","topic":"eigen","difficulty":1,"src":"L7 s.21","prompt":"Complete the statement.","text":"The eigenvalues of a triangular matrix are its {{1}} entries, and their product is the {{2}} of the matrix.","blanks":[["diagonal"],["determinant","det"]],"explain":"For triangular $A$, $\\det(A-\\lambda I) = \\prod (a_{ii} - \\lambda)$."},{"id":"q5","type":"numeric","topic":"eigen","difficulty":2,"src":"L7 s.24","prompt":"$A$ has the eigenvalue $2$ with eigenvector $\\mathbf v$. Which eigenvalue does $A^3 + I$ have for $\\mathbf v$?","answer":9,"tolerance":0,"hints":["Apply $A$ three times to $\\mathbf v$."],"solution":["$A^3\\mathbf v = 2^3\\mathbf v = 8\\mathbf v$.","$(A^3 + I)\\mathbf v = 8\\mathbf v + \\mathbf v = 9\\mathbf v$."]},{"id":"q6","type":"mcq","topic":"diagonalisation","difficulty":3,"src":"L7 s.28","prompt":"What is the geometric multiplicity of $\\lambda = 1$ for $\\begin{pmatrix} 1 & 1 \\\\ 0 & 1 \\end{pmatrix}$?","options":["$0$","$1$","$2$","It depends on the field"],"answer":1,"hints":["Compute $\\ker(A - I)$."],"explain":"$A - I = \\begin{pmatrix} 0 & 1 \\\\ 0 & 0 \\end{pmatrix}$ has a 1-dimensional kernel spanned by $\\mathbf e_1$. Algebraic multiplicity is 2, so the matrix is not diagonalisable. Option 3 is the classic confusion with the algebraic multiplicity."},{"id":"q7","type":"order","topic":"diagonalisation","difficulty":2,"src":"L7 s.27","prompt":"Put the steps for diagonalising $A$ in order.","items":["Compute the characteristic polynomial $\\det(A - \\lambda I)$","Find its roots (the eigenvalues)","Find a basis of each eigenspace","Check that there are $n$ independent eigenvectors","Form $P$ from the eigenvectors and $D$ from the eigenvalues"],"explain":"If step 4 fails, $A$ is not diagonalisable and you stop there."},{"id":"q8","type":"text","topic":"eigen","difficulty":3,"src":"L7 s.13","prompt":"Explain in two or three sentences why $\\lambda$ is an eigenvalue of $A$ exactly when $\\det(A - \\lambda I) = 0$.","answer":"$\\lambda$ is an eigenvalue when $(A - \\lambda I)\\mathbf v = \\mathbf 0$ has a solution $\\mathbf v \\neq \\mathbf 0$. A square homogeneous system has a non-trivial solution exactly when its matrix is singular (not invertible), which is equivalent to its determinant being zero.","keywords":["non-zero","singular","invertible","kernel","determinant"]}]}</script>

<script>
ALS.boot(function (quiz) {

  var S = { phase: 'start', mode: settings.mode, topic: 'all', level: 'all', list: [], i: 0, answers: {}, graded: {}, hints: {}, steps: {}, t0: 0, qt0: 0, timer: null, remaining: null };

  /* ---------- checking ---------- */
  function norm(s) { return String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,;:!?]+$/, ''); }
  function parseNum(s) {
    s = String(s || '').trim().replace(/\s/g, '').replace(/,(?=\d{1,}$)/, '.').replace(/[−–]/g, '-');
    var fr = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (fr) return parseFloat(fr[1]) / parseFloat(fr[2]);
    var v = Number(s.replace(/×10\^/i, 'e').replace(/\*10\^/i, 'e'));
    return isNaN(v) ? null : v;
  }
  function check(q, a) {
    switch (q.type) {
      case 'mcq': return a === q.answer;
      case 'multi':
        if (!Array.isArray(a)) return false;

      case 'numeric':
        var v = parseNum(a); if (v == null) return false;
        var tol = q.tolerance != null ? q.tolerance : Math.max(1e-9, Math.abs(q.answer) * 1e-6);
        return Math.abs(v - q.answer) <= tol;
      case 'cloze':
        if (!Array.isArray(a)) return false;
        return q.blanks.every(function (alts, k) { return alts.some(function (x) { return norm(x) === norm(a[k]); }); });
      case 'order':
        return Array.isArray(a) && a.join('\u0001') === q.items.join('\u0001');

        return a && a.self ? a.self === 'yes' : null;

  function blankOk(q, k, v) { return q.blanks[k].some(function (x) { return norm(x) === norm(v); }); }

  /* ---------- start ---------- */
  function startView() {

    var topicSel = E('select', { class: 'als-select', id: 'tr-topic' }, [E('option', { value: 'all', text: 'All topics (' + quiz.questions.length + ')' })].concat(Object.keys(topics).sort().map(function (t) { return E('option', { value: t, text: t + ' (' + topics[t] + ')' }); })));
    var levelSel = E('select', { class: 'als-select', id: 'tr-level' }, levels.map(function (l) { return E('option', { value: l[0], text: l[1] }); }));

      return E('button', { type: 'button', 'aria-pressed': String(S.mode === m), text: m === 'practice' ? 'Practice: feedback each step' : 'Test: feedback at the end', onclick: function () { S.mode = m; render(); } });
    }));
    var last = ALS.store.get('last', null);
    return E('div', { class: 'tr-wrap tr-start als-rise' }, [
      E('div', {}, [
        E('div', { class: 'als-kicker', text: (quiz.module ? quiz.module + ' · ' : '') + quiz.questions.length + ' questions' }),
        E('h1', { class: 'als-h1', text: quiz.title }),
        quiz.subtitle ? E('p', { class: 'als-sub', text: quiz.subtitle }) : null
      ]),
      E('div', { class: 'als-card tr-settings' }, [
        E('div', {}, [E('label', { for: 'tr-topic', text: 'Topic' }), topicSel]),
        E('div', {}, [E('label', { for: 'tr-level', text: 'Difficulty' }), levelSel]),
        E('div', { style: 'grid-column: 1 / -1' }, [E('label', { text: 'Mode' }), modeSeg])
      ]),
      last ? E('p', { class: 'als-muted', style: 'margin:0', text: 'Last attempt: ' + last.score + '% on ' + last.date }) : null,
      E('div', { class: 'als-row' }, [
        E('button', { type: 'button', class: 'als-btn als-btn--primary', text: 'Start', onclick: function () { begin(topicSel.value, levelSel.value); } }),
        settings.timeLimitMin ? E('span', { class: 'als-chip', text: 'Test mode time limit: ' + settings.timeLimitMin + ' min' }) : null
      ])
    ]);
  }

  function begin(topic, level, onlyIds) {
    var pool = quiz.questions.filter(function (q) {
      if (onlyIds) return onlyIds.indexOf(q.id) > -1;
      return (topic === 'all' || q.topic === topic) && (level === 'all' || String(q.difficulty || 2) === level);
    });
    if (!pool.length) { ALS.toast('No questions match these filters'); return; }
    S.list = settings.shuffle && !onlyIds ? ALS.shuffle(pool) : pool;
    S.i = 0; S.answers = {}; S.graded = {}; S.hints = {}; S.steps = {}; S.times = {};
    S.phase = 'question'; S.t0 = Date.now(); S.qt0 = Date.now();
    clearInterval(S.timer);
    if (S.mode === 'test' && settings.timeLimitMin) {
      S.remaining = settings.timeLimitMin * 60;
      S.timer = setInterval(function () {
        S.remaining--; var t = $('.tr-timer');
        if (t) { t.textContent = fmt(S.remaining); t.classList.toggle('is-low', S.remaining < 60); }
        if (S.remaining <= 0) { clearInterval(S.timer); ALS.toast('Time is up'); finish(); }
      }, 1000);
    }
    render();
  }
  function fmt(sec) { sec = Math.max(0, sec); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }

  /* ---------- question rendering ---------- */
  function inputFor(q, locked) {
    var a = S.answers[q.id];
    var g = S.graded[q.id];
    if (q.type === 'mcq' || q.type === 'multi') {
      var multi = q.type === 'multi';
      var box = E('div', { class: 'tr-opts', role: multi ? 'group' : 'radiogroup' });
      q.options.forEach(function (o, k) {
        var sel = multi ? (a || []).indexOf(k) > -1 : a === k;
        var btn = E('button', { type: 'button', class: 'tr-opt', role: multi ? 'checkbox' : 'radio', 'aria-checked': String(sel), 'data-multi': multi || null, disabled: locked || null }, [
          E('span', { class: 'k', text: String(k + 1) }), E('span', { class: 'als-rich', html: ALS.md(o, { inline: true }) })
        ]);
        if (g != null) {
          var right = multi ? q.answer.indexOf(k) > -1 : q.answer === k;
          if (right) btn.classList.add('is-right'); else if (sel) btn.classList.add('is-wrong');
        }
        btn.addEventListener('click', function () { choose(q, k); });
        box.appendChild(btn);
      });
      return box;
    }
    if (q.type === 'numeric') {
      var inp = E('input', { class: 'als-input', type: 'text', inputmode: 'decimal', autocomplete: 'off', placeholder: 'Your answer', value: a == null ? '' : a, disabled: locked || null, 'aria-label': 'Numeric answer' });
      inp.addEventListener('input', function () { S.answers[q.id] = inp.value; });
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') primary(); });
      if (g != null) inp.classList.add(g ? 'is-right' : 'is-wrong');
      return E('div', { class: 'tr-num' }, [inp, q.unit ? E('span', { class: 'tr-unit', text: q.unit }) : null]);
    }
    if (q.type === 'text') {
      var ta = E('textarea', { class: 'als-textarea', placeholder: 'Write your answer, then compare it with the model answer.', disabled: locked || null, 'aria-label': 'Your answer' });
      ta.value = (a && a.text) || '';
      ta.addEventListener('input', function () { S.answers[q.id] = Object.assign({}, S.answers[q.id], { text: ta.value }); });
      return ta;
    }
    if (q.type === 'cloze') {
      var parts = String(q.text).split(/\{\{(\d+)\}\}/);
      var div = E('div', { class: 'tr-cloze als-rich' });
      var vals = a || [];
      var html = '';
      parts.forEach(function (p, k) { html += k % 2 === 0 ? ALS.md(p, { inline: true }) : '<span data-blank="' + (parseInt(p, 10) - 1) + '"></span>'; });
      div.innerHTML = html;
      $$('[data-blank]', div).forEach(function (slot) {
        var bi = +slot.getAttribute('data-blank');
        var inp = E('input', { class: 'als-input', type: 'text', autocomplete: 'off', 'aria-label': 'Blank ' + (bi + 1), value: vals[bi] || '', disabled: locked || null, size: String(Math.max(6, (q.blanks[bi] && q.blanks[bi][0] || '').length + 2)) });
        inp.addEventListener('input', function () { var v = (S.answers[q.id] || []).slice(); v[bi] = inp.value; S.answers[q.id] = v; });
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') primary(); });
        if (g != null) inp.classList.add(blankOk(q, bi, vals[bi]) ? 'is-right' : 'is-wrong');
        slot.replaceWith(inp);
      });
      return div;
    }
    if (q.type === 'order') {
      if (!a) { a = ALS.shuffle(q.items); if (a.join() === q.items.join() && a.length > 1) a.reverse(); S.answers[q.id] = a; }
      var ol = E('ol', { class: 'tr-order', 'aria-label': 'Put the items in the correct order' });
      a.forEach(function (item, k) {
        var li = E('li', {}, [
          E('span', { class: 'n', text: String(k + 1) }), E('span', { class: 'als-rich', html: ALS.md(item, { inline: true }) }),
          E('span', { class: 'mv' }, [
            E('button', { type: 'button', class: 'als-btn als-btn--sm als-btn--ghost', 'aria-label': 'Move up', text: '↑', disabled: locked || k === 0 || null, onclick: function () { move(q, k, -1); } }),
            E('button', { type: 'button', class: 'als-btn als-btn--sm als-btn--ghost', 'aria-label': 'Move down', text: '↓', disabled: locked || k === a.length - 1 || null, onclick: function () { move(q, k, 1); } })
          ])
        ]);
        if (g != null) li.classList.add(item === q.items[k] ? 'is-right' : 'is-wrong');
        ol.appendChild(li);
      });
      return ol;
    }
    return E('p', { text: 'Unsupported question type: ' + q.type });
  }

  function choose(q, k) {
    if (S.graded[q.id] != null && S.mode === 'practice') return;
    if (q.type === 'multi') {
      var cur = (S.answers[q.id] || []).slice(); var at = cur.indexOf(k);
      if (at > -1) cur.splice(at, 1); else cur.push(k);
      S.answers[q.id] = cur;
    } else S.answers[q.id] = k;
    render();
  }
  function move(q, k, d) {
    var a = S.answers[q.id].slice(); var t = a[k]; a[k] = a[k + d]; a[k + d] = t; S.answers[q.id] = a; render();
  }

  function answered(q) {
    var a = S.answers[q.id];
    if (q.type === 'mcq') return a != null;
    if (q.type === 'multi') return a && a.length > 0;
    if (q.type === 'numeric') return a != null && String(a).trim() !== '';
    if (q.type === 'text') return a && a.text && a.text.trim().length > 0;
    if (q.type === 'cloze') return Array.isArray(a) && a.some(function (x) { return x && x.trim(); });
    if (q.type === 'order') return true;
    return false;
  }

  function feedback(q) {
    var g = S.graded[q.id];
    var box = E('div', { class: 'tr-feedback' });
    if (q.type === 'text') {
      var a = S.answers[q.id] || {};
      var model = E('div', { class: 'als-callout als-callout--info' }); ALS.rich(model, '**Model answer.** ' + q.answer);
      box.appendChild(model);
      if (q.keywords && q.keywords.length) {
        var txt = norm(a.text);
        box.appendChild(E('div', {}, [E('div', { class: 'als-muted', style: 'font-size:.8125rem;margin-bottom:.35rem', text: 'Key ideas a full answer mentions' }),
          E('div', { class: 'tr-kw' }, q.keywords.map(function (k) { var hit = txt.indexOf(norm(k)) > -1; return E('span', { class: 'als-chip ' + (hit ? 'als-chip--good' : 'als-chip--warn'), text: (hit ? '✓ ' : '○ ') + k }); }))]));
      }
      if (!a.self) {
        box.appendChild(E('div', {}, [E('div', { style: 'font-weight:600;margin-bottom:.4rem', text: 'How did you do?' }), E('div', { class: 'als-row' }, [
          E('button', { type: 'button', class: 'als-btn als-btn--good', text: 'Got it', onclick: function () { selfGrade(q, 'yes'); } }),
          E('button', { type: 'button', class: 'als-btn als-btn--warn', text: 'Partly', onclick: function () { selfGrade(q, 'partly'); } }),
          E('button', { type: 'button', class: 'als-btn als-btn--bad', text: 'Missed it', onclick: function () { selfGrade(q, 'no'); } })
        ])]));
        return box;
      }
    } else {
      var verdict = E('div', { class: 'als-callout ' + (g ? 'als-callout--good' : 'als-callout--bad') });
      var right = '';
      if (!g) {
        if (q.type === 'mcq') right = ' Correct answer: **' + (q.answer + 1) + '.** ' + q.options[q.answer];
        else if (q.type === 'multi') right = ' Correct: ' + q.answer.map(function (k) { return '**' + (k + 1) + '**'; }).join(', ') + '.';
        else if (q.type === 'numeric') right = ' Expected **' + q.answer + (q.unit ? ' ' + q.unit : '') + '**' + (q.tolerance ? ' (± ' + q.tolerance + ')' : '') + '.';
        else if (q.type === 'cloze') right = ' Expected: ' + q.blanks.map(function (b) { return '**' + b[0] + '**'; }).join(', ') + '.';
        else if (q.type === 'order') right = ' Correct order: ' + q.items.map(function (x, k) { return (k + 1) + '. ' + x; }).join(' · ');
      }
      ALS.rich(verdict, (g ? '**Correct.**' : '**Not quite.**') + right);
      box.appendChild(verdict);
    }
    if (q.explain) { var ex = E('div', { class: 'als-rich' }); ALS.rich(ex, q.explain); box.appendChild(ex); }
    if (q.solution && q.solution.length) box.appendChild(solutionBlock(q, true));
    return box;
  }

  /* Worked solution, revealed one step at a time (faded worked example). */
  function solutionBlock(q, afterAnswer) {
    var n = S.steps[q.id] || 0;
    if (afterAnswer && !S.graded[q.id] && n === 0) n = 0;
    var wrap = E('div', { class: 'tr-solution als-card als-card--sunken als-card--flat' });
    wrap.appendChild(E('div', { class: 'als-kicker', text: 'Worked solution' }));
    var ol = E('ol');
    q.solution.slice(0, n).forEach(function (s) { var li = E('li', { class: 'als-rise' }); ALS.rich(li, s); ol.appendChild(li); });
    wrap.appendChild(ol);
    if (n < q.solution.length) {
      wrap.appendChild(E('div', { class: 'als-row', style: 'margin-top:.5rem' }, [
        E('button', { type: 'button', class: 'als-btn als-btn--sm', text: n === 0 ? 'Show first step' : 'Next step (' + n + '/' + q.solution.length + ')', onclick: function () { S.steps[q.id] = n + 1; render(); } }),
        n > 0 ? E('button', { type: 'button', class: 'als-btn als-btn--sm als-btn--ghost', text: 'Show all', onclick: function () { S.steps[q.id] = q.solution.length; render(); } }) : null
      ]));
    }
    return wrap;
  }

  function selfGrade(q, v) {
    S.answers[q.id] = Object.assign({}, S.answers[q.id], { self: v });
    S.graded[q.id] = v === 'yes';
    render();
  }

  function primary() {
    var q = S.list[S.i];
    if (S.mode === 'practice') {
      if (S.graded[q.id] == null && !(q.type === 'text' && S.answers[q.id] && S.answers[q.id].checked)) {
        if (!answered(q)) { ALS.toast('Answer first, or use a hint'); return; }
        S.times[q.id] = Math.round((Date.now() - S.qt0) / 1000);
        if (q.type === 'text') { S.answers[q.id] = Object.assign({}, S.answers[q.id], { checked: true }); }
        else S.graded[q.id] = check(q, S.answers[q.id]);
        render(); return;
      }
      if (q.type === 'text' && S.graded[q.id] == null) { ALS.toast('Rate your answer first'); return; }
      advance(1);
    } else advance(1);
  }

  function advance(d) {
    var j = S.i + d;
    if (j >= S.list.length) { if (S.mode === 'test') confirmFinish(); else finish(); return; }
    if (j < 0) return;
    S.i = j; S.qt0 = Date.now(); render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function confirmFinish() {
    var open = S.list.filter(function (q) { return !answered(q); }).length;
    if (open && !window.confirm(open + ' question(s) unanswered. Finish anyway?')) return;
    finish();
  }

  function questionView() {
    var q = S.list[S.i];
    var locked = S.mode === 'practice' && (S.graded[q.id] != null || (q.type === 'text' && S.answers[q.id] && S.answers[q.id].checked));
    var wrap = E('div', { class: 'tr-wrap' });
    wrap.appendChild(E('div', { class: 'tr-meta' }, [
      E('span', { text: 'Question ' + (S.i + 1) + ' of ' + S.list.length + (q.topic ? ' · ' + q.topic : '') }),
      S.remaining != null ? E('span', { class: 'tr-timer', text: fmt(S.remaining) }) : E('span', { text: ['', 'Warm-up', 'Core', 'Challenge'][q.difficulty || 2] })
    ]));
    wrap.appendChild(E('div', { class: 'als-progress', style: 'margin-bottom:1rem' }, [E('span', { style: 'width:' + Math.round(S.i / S.list.length * 100) + '%' })]));
    if (S.mode === 'test') {
      wrap.appendChild(E('div', { class: 'tr-dots', role: 'navigation', 'aria-label': 'Jump to question' }, S.list.map(function (qq, k) {
        return E('button', { type: 'button', class: 'tr-dot' + (answered(qq) ? ' is-answered' : ''), 'aria-current': String(k === S.i), text: String(k + 1), onclick: function () { S.i = k; render(); } });
      })));
    }
    var card = E('div', { class: 'als-card tr-q als-rise' });
    card.appendChild(E('div', { class: 'als-kicker', text: { mcq: 'Choose one', multi: 'Choose all that apply', numeric: 'Calculate', text: 'Explain', cloze: 'Fill the gaps', order: 'Put in order' }[q.type] }));
    var prompt = E('div', { class: 'tr-prompt' }); ALS.rich(prompt, q.prompt); card.appendChild(prompt);
    card.appendChild(inputFor(q, locked));

    var used = S.hints[q.id] || 0;
    if (used && q.hints) {
      var hb = E('div', { class: 'tr-hints', style: 'margin-top:1rem' });
      q.hints.slice(0, used).forEach(function (h, k) { var c = E('div', { class: 'als-callout als-callout--warn' }); ALS.rich(c, '**Hint ' + (k + 1) + '.** ' + h); hb.appendChild(c); });
      card.appendChild(hb);
    }
    var actions = E('div', { class: 'tr-actions' });
    var isGraded = S.graded[q.id] != null;
    var label = S.mode === 'test' ? (S.i === S.list.length - 1 ? 'Finish test' : 'Next') : (locked ? (S.i === S.list.length - 1 ? 'See results' : 'Next question') : 'Check');
    actions.appendChild(E('button', { type: 'button', class: 'als-btn als-btn--primary', text: label, onclick: primary }));
    if (S.mode === 'test' && S.i > 0) actions.appendChild(E('button', { type: 'button', class: 'als-btn', text: 'Back', onclick: function () { advance(-1); } }));
    if (q.hints && used < q.hints.length && !isGraded) actions.appendChild(E('button', { type: 'button', class: 'als-btn als-btn--ghost', html: ALS.icon('bulb') + ' Hint (' + (q.hints.length - used) + ' left)', onclick: function () { S.hints[q.id] = used + 1; render(); } }));
    if (S.mode === 'practice' && !locked && q.solution && q.solution.length && !S.steps[q.id]) actions.appendChild(E('button', { type: 'button', class: 'als-btn als-btn--ghost', text: 'Stuck? Walk me through it', onclick: function () { S.steps[q.id] = 1; S.hints[q.id] = (q.hints || []).length; render(); } }));
    actions.appendChild(E('div', { class: 'als-spacer' }));
    actions.appendChild(E('span', { class: 'als-faint', style: 'font-size:.75rem', html: '<span class="als-kbd">Enter</span> ' + (locked ? 'next' : 'check') }));
    card.appendChild(actions);
    if (S.mode === 'practice' && !locked && S.steps[q.id]) card.appendChild(solutionBlock(q, false));
    if (S.mode === 'practice' && locked) card.appendChild(feedback(q));
    var prov = ALS.provenance(q); if (prov) { prov.style.marginTop = '1rem'; card.appendChild(prov); }
    wrap.appendChild(card);
    return wrap;
  }

  /* ---------- results ---------- */
  function finish() {
    clearInterval(S.timer);
    S.list.forEach(function (q) {
      if (S.graded[q.id] == null && q.type !== 'text') S.graded[q.id] = answered(q) ? check(q, S.answers[q.id]) : false;
    });
    S.phase = 'results';
    render();
  }

  function resultItems() {
    return S.list.map(function (q) {
      var g = S.graded[q.id];
      var a = S.answers[q.id];
      return { id: q.id, topic: q.topic || null, type: q.type, correct: g === true, partial: q.type === 'text' && a && a.self === 'partly', hintsUsed: S.hints[q.id] || 0, stepsViewed: S.steps[q.id] || 0, timeSec: S.times[q.id] || null, unanswered: !answered(q) };
    });
  }

  function resultsView() {
    var items = resultItems();
    var pending = S.list.filter(function (q) { return q.type === 'text' && S.graded[q.id] == null; });
    var gradedN = items.length - pending.length;
    var right = items.filter(function (r) { return r.correct; }).length + items.filter(function (r) { return r.partial; }).length * 0.5;
    var pct = gradedN ? Math.round(right / gradedN * 100) : 0;
    ALS.store.set('last', { score: pct, date: ALS.today() });
    var byTopic = {};
    items.forEach(function (r) { var t = r.topic || 'general'; byTopic[t] = byTopic[t] || { n: 0, ok: 0 }; byTopic[t].n++; byTopic[t].ok += r.correct ? 1 : r.partial ? .5 : 0; });
    var wrap = E('div', { class: 'tr-wrap als-stack' });
    var pass = pct / 100 >= settings.passMark;
    wrap.appendChild(E('div', { class: 'als-card als-rise' }, [
      E('div', { class: 'als-kicker', text: S.mode === 'test' ? 'Test results' : 'Practice results' }),
      E('div', { class: 'tr-score', text: pct + '%' }),
      E('p', { class: 'als-muted', text: right + ' of ' + gradedN + ' correct' + (pending.length ? ' · ' + pending.length + ' written answers still to self-check below' : '') + ' · ' + Math.round((Date.now() - S.t0) / 60000) + ' min' }),
      E('span', { class: 'als-chip ' + (pass ? 'als-chip--good' : 'als-chip--warn'), text: pass ? 'Above your pass mark' : 'Below your pass mark of ' + Math.round(settings.passMark * 100) + '%' })
    ]));
    var tp = E('div', { class: 'als-card tr-topics' }, [E('h3', { class: 'als-h3', text: 'By topic' })]);
    Object.keys(byTopic).sort(function (a, b) { return byTopic[a].ok / byTopic[a].n - byTopic[b].ok / byTopic[b].n; }).forEach(function (t) {
      var v = Math.round(byTopic[t].ok / byTopic[t].n * 100);
      tp.appendChild(E('div', { class: 'tr-topic' }, [E('span', { text: t }), E('div', { class: 'als-progress' }, [E('span', { style: 'width:' + v + '%;background:' + (v >= 80 ? 'var(--good)' : v >= 50 ? 'var(--warn)' : 'var(--bad)') })]), E('span', { class: 'als-mono', text: v + '%' })]));
    });
    wrap.appendChild(tp);
    var missed = S.list.filter(function (q) { return !S.graded[q.id]; });
    wrap.appendChild(E('div', { class: 'als-row' }, [
      E('button', { type: 'button', class: 'als-btn als-btn--primary', html: ALS.icon('download') + ' Save results', onclick: function () { ALS.exportResults('quiz', resultItems(), { score: pct, mode: S.mode }); } }),
      missed.length ? E('button', { type: 'button', class: 'als-btn', text: 'Retry ' + missed.length + ' missed', onclick: function () { S.mode = 'practice'; begin('all', 'all', missed.map(function (q) { return q.id; })); } }) : null,
      E('button', { type: 'button', class: 'als-btn', text: 'New round', onclick: function () { S.phase = 'start'; render(); } })
    ]));
    var rev = E('div', { class: 'tr-review' }, [E('h3', { class: 'als-h3', style: 'margin-top:1rem', text: 'Review' })]);
    S.list.forEach(function (q, k) {
      var c = E('details', { class: 'als-card', open: (!S.graded[q.id] && k < 12) || null });
      var g = S.graded[q.id];
      c.appendChild(E('summary', { style: 'cursor:pointer;list-style:none' }, [E('span', { class: 'als-row' }, [
        E('span', { class: 'als-chip ' + (g === true ? 'als-chip--good' : g == null ? 'als-chip--warn' : 'als-chip--bad'), text: g === true ? 'Correct' : g == null ? 'Self-check' : 'Review' }),
        E('span', { class: 'als-rich', html: ALS.md((k + 1) + '. ' + String(q.prompt).split('\n')[0].slice(0, 140), { inline: true }) })
      ])]));
      var body = E('div', { style: 'margin-top:1rem' });
      body.appendChild(inputFor(q, true));
      body.appendChild(feedback(q));
      c.appendChild(body);
      rev.appendChild(c);
    });
    wrap.appendChild(rev);
    return wrap;
  }

  function render() {
    app.innerHTML = '';
    app.appendChild(ALS.topbar([]));
    var main = E('main', { class: 'als-shell als-frame' });
    main.appendChild(S.phase === 'start' ? startView() : S.phase === 'question' ? questionView() : resultsView());
    app.appendChild(main);
    ALS.applyMode();
    ALS.renderMath(app);
  }

  ALS.onKey({
    'Enter': function () { if (S.phase === 'question') primary(); },
    'ArrowRight': function () { if (S.phase === 'question' && S.mode === 'test') advance(1); },
    'ArrowLeft': function () { if (S.phase === 'question' && S.mode === 'test') advance(-1); },
    'h': function () { var q = S.list[S.i]; if (S.phase === 'question' && q.hints && (S.hints[q.id] || 0) < q.hints.length) { S.hints[q.id] = (S.hints[q.id] || 0) + 1; render(); } }
  });
  document.addEventListener('keydown', function (e) {
    if (S.phase !== 'question' || /INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) return;
    var q = S.list[S.i];
    if ((q.type === 'mcq' || q.type === 'multi') && /^[1-9]$/.test(e.key) && +e.key <= q.options.length) { e.preventDefault(); choose(q, +e.key - 1); }
  });

  render();
});
</script>
</body>
</html>
