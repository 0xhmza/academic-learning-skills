<style>
  html, body { overflow-x: clip; } /* slide-in animation must never cause a horizontal scrollbar */
  .ls-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; background: transparent; }
  .ls-progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
  .ls-stage { min-height: calc(100vh - 3.5rem - 4rem); display: flex; align-items: center; justify-content: center; padding: 2rem 0 1rem; }
  .ls-slide { width: 100%; }
  .ls-inner { width: 100%; max-width: 60rem; margin: 0 auto; }
  .ls-slide .als-h2 { font-size: clamp(1.6rem, 4vw, 2.6rem); margin-bottom: 1.25rem; }
  .ls-big { font-size: clamp(1.1rem, 2.2vw, 1.45rem); line-height: 1.55; }

  /* step reveal */
  .ls-step { transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), filter .5s ease; }
  .ls-step.is-hidden { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .ls-step.is-past { opacity: .55; }
  .ls-step.is-current { opacity: 1; }

  /* title */
  .ls-title { text-align: left; }
  .ls-title .als-h1 { font-size: clamp(2.3rem, 7vw, 4.75rem); max-width: 18ch; }
  .ls-title .als-sub { font-size: clamp(1.05rem, 2.2vw, 1.35rem); margin-top: 1rem; }
  .ls-title-meta { margin-top: 2.5rem; display: flex; gap: .5rem; flex-wrap: wrap; }

  /* points / summary */
  .ls-points { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
  .ls-points li { display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; align-items: start; }
  .ls-points .n { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); padding-top: .35rem; }
  .ls-summary li .n { color: var(--good); }

  /* derivation steps */
  .ls-deriv { display: grid; gap: .5rem; }
  .ls-deriv-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; padding: .7rem 1rem; border-radius: var(--radius-sm); border: 1px solid transparent; }
  .ls-deriv-row.is-current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ls-deriv-row .t { color: var(--text-muted); font-size: .98rem; }
  .ls-deriv-row .m { font-size: 1.2rem; overflow-x: auto; }

  /* diagram */
  .ls-diagram { display: grid; gap: 1rem; }
  .ls-svg { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; justify-content: center; }
  .ls-svg svg { width: 100%; height: auto; max-height: 58vh; color: var(--text); font-family: var(--font-body); }
  .ls-svg [data-ls-hidden="1"] { opacity: 0; }
  .ls-svg .ls-svg-el { transition: opacity .55s ease; }
  .ls-svg .ls-svg-el.is-current { animation: ls-pulse 1.2s ease 1; }
  @keyframes ls-pulse { 0% { opacity: .2; } 100% { opacity: 1; } }
  .ls-caption { min-height: 3.2rem; font-size: 1.05rem; }
  /* diagram colour classes that follow the theme */
  .ls-svg .d-line { stroke: var(--text); fill: none; }
  .ls-svg .d-muted { stroke: var(--text-faint); fill: none; }
  .ls-svg .d-accent { stroke: var(--accent); fill: none; }
  .ls-svg .d-accent2 { stroke: var(--accent-2); fill: none; }
  .ls-svg .d-good { stroke: var(--good); fill: none; }
  .ls-svg .d-bad { stroke: var(--bad); fill: none; }
  .ls-svg .d-fill { fill: var(--bg-sunken); stroke: var(--border-strong); }
  .ls-svg .d-fill-accent { fill: var(--accent-soft); stroke: var(--accent); }
  .ls-svg .d-solid-accent { fill: var(--accent); stroke: none; }
  .ls-svg .d-solid-accent2 { fill: var(--accent-2); stroke: none; }
  .ls-svg .d-solid-muted { fill: var(--text-faint); stroke: none; }
  .ls-svg .d-solid-line { fill: var(--text); stroke: none; }
  .ls-svg .d-solid-good { fill: var(--good); stroke: none; }
  .ls-svg .d-solid-bad { fill: var(--bad); stroke: none; }
  .ls-svg .d-text { fill: var(--text); stroke: none; font-size: 14px; }
  .ls-svg .d-text-muted { fill: var(--text-muted); stroke: none; font-size: 12px; }
  .ls-svg .d-text-accent { fill: var(--accent); stroke: none; font-size: 14px; font-weight: 600; }

  /* code */
  .ls-code { display: grid; gap: 1rem; }
  @media (min-width: 900px) { .ls-code.has-explain { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  .ls-explain { font-size: 1.05rem; }

  /* compare */
  .ls-compare { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .ls-compare .als-card ul { margin: 0; padding-left: 1.1rem; }
  .ls-compare .als-card li + li { margin-top: .4rem; }

  /* quote */
  .ls-quote { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.6rem); line-height: 1.3; margin: 0; max-width: 32ch; text-wrap: balance; }
  .ls-quote::before { content: "\201C"; display: block; font-size: 4rem; line-height: .6; color: var(--accent); margin-bottom: .5rem; }
  .ls-quote-by { margin-top: 1.25rem; color: var(--text-muted); font-size: 1.05rem; }

  /* check */
  .ls-options { display: grid; gap: .6rem; margin-top: 1rem; }
  .ls-option { text-align: left; justify-content: flex-start; min-height: 3rem; font-size: 1.02rem; padding: .6rem 1rem; }
  .ls-option.is-right { background: var(--good-soft); border-color: var(--good); }
  .ls-option.is-wrong { background: var(--bad-soft); border-color: var(--bad); }

  /* timeline */
  .ls-timeline { position: relative; display: grid; gap: 1rem; padding-left: 1.75rem; }
  .ls-timeline::before { content: ""; position: absolute; left: .45rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--border-strong); }
  .ls-event { position: relative; }
  .ls-event::before { content: ""; position: absolute; left: -1.62rem; top: .45rem; width: .8rem; height: .8rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .ls-event.is-current::before { background: var(--accent); }
  .ls-event .when { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); }

  /* definition */
  .ls-term { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.5rem); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.05; margin: .25rem 0 1rem; }
  .ls-def { font-size: clamp(1.1rem, 2.4vw, 1.5rem); max-width: 42rem; }
  .ls-example { margin-top: 1.5rem; }

  /* chrome */
  .ls-bottom { position: sticky; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
  .ls-bottom .als-shell { display: flex; align-items: center; gap: .5rem; min-height: 3.5rem; }
  .ls-count { font-family: var(--font-mono); font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ls-notes { max-width: 60rem; margin: 0 auto 1rem; }
  .ls-overview { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); padding: 2rem 0 4rem; }
  .ls-thumb { text-align: left; cursor: pointer; min-height: 7rem; display: flex; flex-direction: column; gap: .35rem; }
  .ls-thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ls-thumb .n { font-family: var(--font-mono); font-size: .7rem; color: var(--text-faint); }
  .ls-thumb .t { font-weight: 600; font-family: var(--font-display); }
  .ls-anim-in { animation: ls-in .5s cubic-bezier(.2,.7,.2,1) both; }
  .ls-anim-back { animation: ls-back .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes ls-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes ls-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

  @media print {
    .ls-progress, .ls-bottom, .ls-overview { display: none !important; }
    .ls-stage { min-height: 0; display: block; padding: 0; }
    .ls-print-slide { break-after: page; padding: 8mm 0; }
    .ls-step.is-hidden, .ls-step.is-past { opacity: 1 !important; transform: none !important; }
    .ls-svg [data-ls-hidden="1"] { opacity: 1 !important; }
  }
</style>
</head>

<script type="application/json" id="als-data">{"als":"1","kind":"lesson","title":"Eigenvalues and eigenvectors","subtitle":"The directions a matrix only stretches","module":"linear-algebra","subject":"Linear algebra","sources":[{"id":"L7","title":"Lecture 7: Eigenvalues","locator":"slides 1-34"}],"slides":[{"layout":"title","title":"Eigenvalues and **eigenvectors**","subtitle":"The directions a matrix only stretches, and why they make hard problems easy","kicker":"Linear Algebra II · Week 7"},{"layout":"points","title":"Why care?","points":["Most vectors change **direction** when you multiply by $A$. A few special ones do not.","Along those directions $A$ acts like a number: $A\\mathbf v = \\lambda \\mathbf v$.","Knowing them turns $A^{100}$, differential equations and Markov chains into scalar problems.","They are behind PCA, vibration modes, PageRank and stability analysis."],"notes":"Motivate with the question: what does a matrix *do* geometrically?"},{"layout":"definition","kind":"Definition","term":"Eigenvector, eigenvalue","definition":"Let $A \\in \\mathbb R^{n\\times n}$. A vector $\\mathbf v \\neq \\mathbf 0$ with $$A\\mathbf v = \\lambda \\mathbf v$$ is an **eigenvector** of $A$, and the scalar $\\lambda$ is its **eigenvalue**.","example":"For $A = \\begin{pmatrix} 2 & 0 \\\\ 0 & 3 \\end{pmatrix}$, $\\mathbf e_1$ is an eigenvector with $\\lambda = 2$ and $\\mathbf e_2$ one with $\\lambda = 3$.","src":"L7 s.5"},{"layout":"diagram","title":"Watch $A = \\begin{pmatrix} 2 & 1 \\\\ 1 & 2 \\end{pmatrix}$ act","svg":"<svg viewBox='0 0 600 340' xmlns='http://www.w3.org/2000/svg'><defs><marker id='ah' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' class='d-solid-accent'/><\/marker><marker id='am' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' class='d-solid-muted'/><\/marker><marker id='a2' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0 0 L10 5 L0 10 z' class='d-solid-accent2'/><\/marker><\/defs><g id='axes'><line class='d-muted' x1='40' y1='250' x2='570' y2='250'/><line class='d-muted' x1='200' y1='330' x2='200' y2='20'/><text class='d-text-muted' x='556' y='270'>x<\/text><text class='d-text-muted' x='210' y='32'>y<\/text><\/g><g id='w'><line class='d-muted' stroke-width='2.5' x1='200' y1='250' x2='250' y2='250' marker-end='url(#am)'/><text class='d-text-muted' x='236' y='272'>w<\/text><line class='d-muted' stroke-width='2.5' stroke-dasharray='5 4' x1='200' y1='250' x2='300' y2='200' marker-end='url(#am)'/><text class='d-text-muted' x='306' y='198'>Aw: turned<\/text><\/g><g id='v'><line class='d-accent' stroke-width='3' x1='200' y1='250' x2='350' y2='100' marker-end='url(#ah)'/><line class='d-line' stroke-width='3' x1='200' y1='250' x2='250' y2='200'/><text class='d-text' x='226' y='192'>v<\/text><text class='d-text-accent' x='358' y='98'>Av = 3v<\/text><\/g><g id='u'><line class='d-accent2' stroke-width='3' x1='200' y1='250' x2='250' y2='300' marker-end='url(#a2)'/><text class='d-text' x='258' y='318'>u, Au = 1·u<\/text><\/g><g id='lines'><line class='d-accent' stroke-dasharray='2 6' x1='120' y1='330' x2='420' y2='30'/><line class='d-accent2' stroke-dasharray='2 6' x1='120' y1='170' x2='290' y2='340'/><\/g><\/svg>","steps":[["axes"],["w"],["v"],["u"],["lines"]],"captions":["The plane, before $A$ acts.","A typical vector $\\mathbf w = (1, 0)$ is sent to $(2, 1)$: its direction **changes**.","But $\\mathbf v = (1, 1)$ goes to $(3, 3) = 3\\mathbf v$. Same line, stretched by $\\lambda = 3$.","And $\\mathbf u = (1, -1)$ is left unchanged: $\\lambda = 1$.","These two lines, the **eigenspaces**, are the directions $A$ only scales."],"src":"L7 s.9"},{"layout":"steps","title":"Finding eigenvalues","steps":[{"text":"Start from the definition","math":"A\\mathbf v = \\lambda \\mathbf v,\\quad \\mathbf v \\neq \\mathbf 0"},{"text":"Move everything to one side","math":"(A - \\lambda I)\\,\\mathbf v = \\mathbf 0"},{"text":"A non-zero solution exists exactly when $A - \\lambda I$ is singular","math":"\\det(A - \\lambda I) = 0"},{"text":"For our matrix, expand the determinant","math":"(2-\\lambda)^2 - 1 = \\lambda^2 - 4\\lambda + 3"},{"text":"Factor: the eigenvalues","math":"(\\lambda - 1)(\\lambda - 3) = 0 \\;\\Rightarrow\\; \\lambda \\in \\{1, 3\\}"}],"src":"L7 s.12-14"},{"layout":"steps","title":"Finding an eigenvector for $\\lambda = 3$","steps":[{"text":"Substitute $\\lambda = 3$","math":"A - 3I = \\begin{pmatrix} -1 & 1 \\\\ 1 & -1 \\end{pmatrix}"},{"text":"Solve the homogeneous system","math":"-v_1 + v_2 = 0 \\;\\Rightarrow\\; v_1 = v_2"},{"text":"Any non-zero multiple works","math":"\\mathbf v = t\\begin{pmatrix} 1 \\\\ 1 \\end{pmatrix},\\ t \\neq 0"}],"notes":"Point out that eigenvectors are only determined up to scaling.","src":"L7 s.15"},{"layout":"check","question":"A matrix $A$ is singular. Which number is certainly an eigenvalue?","options":["$1$","$0$","$-1$","$\\operatorname{tr} A$"],"answer":1,"explain":"Singular means $A\\mathbf v = \\mathbf 0 = 0\\cdot\\mathbf v$ for some $\\mathbf v \\neq \\mathbf 0$, so $\\lambda = 0$. The trace is the *sum* of the eigenvalues, not one of them."},{"layout":"points","title":"Shortcuts worth knowing","points":["$\\lambda_1 + \\dots + \\lambda_n = \\operatorname{tr} A$","$\\lambda_1 \\cdots \\lambda_n = \\det A$","Triangular matrix: the eigenvalues are the **diagonal entries**.","Real symmetric matrix: real eigenvalues and an orthonormal basis of eigenvectors."],"src":"L7 s.20-23"},{"layout":"code","title":"Checking with NumPy","lang":"python","code":"import numpy as np\nA = np.array([[2, 1],\n              [1, 2]])\nvals, vecs = np.linalg.eig(A)\nprint(vals)        # [3. 1.]\nprint(vecs[:, 0])  # [0.707 0.707]","highlight":[[1,2,3],[4],[5],[6]],"explain":["Build the matrix as a 2-D array.","`eig` returns the eigenvalues and a matrix whose **columns** are unit eigenvectors.","The eigenvalues we found by hand: 3 and 1.","Column 0 is $(1,1)/\\sqrt 2$, our $\\mathbf v$ scaled to length 1."],"grounded":false},{"layout":"compare","title":"Diagonalisable or not?","columns":[{"heading":"Diagonalisable","points":["$n$ linearly independent eigenvectors","$A = PDP^{-1}$ with $D$ diagonal","e.g. every real symmetric matrix","powers are easy: $A^k = PD^kP^{-1}$"]},{"heading":"Defective","points":["fewer than $n$ independent eigenvectors","geometric < algebraic multiplicity","e.g. the shear $\\begin{pmatrix} 1 & 1 \\\\ 0 & 1 \\end{pmatrix}$","needs the Jordan form instead"]}],"src":"L7 s.28"},{"layout":"check","question":"A $2\\times 2$ matrix has trace $5$ and determinant $6$. Its eigenvalues are","options":["$2$ and $3$","$1$ and $6$","$-2$ and $-3$","$5$ and $6$"],"answer":0,"explain":"They must sum to the trace (5) and multiply to the determinant (6): only $2 + 3 = 5$, $2\\cdot 3 = 6$."},{"layout":"summary","title":"Remember","points":["$A\\mathbf v = \\lambda\\mathbf v$, $\\mathbf v \\neq \\mathbf 0$: directions that are only scaled.","Eigenvalues solve $\\det(A - \\lambda I) = 0$; eigenvectors solve $(A-\\lambda I)\\mathbf v = \\mathbf 0$.","Trace = sum, determinant = product of the eigenvalues.","$n$ independent eigenvectors $\\Leftrightarrow$ diagonalisable."],"notes":"Next: flashcards for this lecture, then the eigenvalue practice set."}]}</script>

    right: '<path d="m9 18 6-6-6-6"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    expand: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
    rotate: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    x: '<path d="M18 6 6 18M6 6l12 12"/>',
    bulb: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
    eye: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    notes: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
    play: '<path d="m6 4 14 8-14 8z"/>',
    pause: '<path d="M7 4h3v16H7zM14 4h3v16h-3z"/>'
  };
  ALS.icon = function (name) {
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[name] || '') + '</svg>';
  };
  ALS.iconBtn = function (name, label, onclick, extraClass) {
    return ALS.el('button', { type: 'button', class: 'als-btn als-btn--ghost als-iconbtn ' + (extraClass || ''), 'aria-label': label, title: label, html: ALS.icon(name), onclick: onclick });
  };

  /* ---------------- theme + mode ---------------- */
  var root = document.documentElement;
  var media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  ALS.loadFonts = function (name) {
    var t = THEMES[name];
    if (!t || !t.fonts || ALS.$('link[data-als-fonts="' + name + '"]')) return;
    document.head.appendChild(ALS.el('link', { rel: 'stylesheet', href: t.fonts, 'data-als-fonts': name }));
  };

  ALS.setTheme = function (name, persist) {
    if (!THEMES[name]) name = root.getAttribute('data-als-default') || Object.keys(THEMES)[0];
    root.setAttribute('data-als-theme', name);
    ALS.loadFonts(name);
    if (persist) ALS.store.set('theme', name);
    ALS.$$('[data-theme-option]').forEach(function (b) { b.setAttribute('aria-checked', String(b.getAttribute('data-theme-option') === name)); });
  };

  ALS.applyMode = function () {
    var pref = ALS.store.globalGet('mode', 'auto');
    var dark = pref === 'dark' || (pref === 'auto' && media && media.matches);
    root.setAttribute('data-als-mode', dark ? 'dark' : 'light');
    var btn = ALS.$('#als-mode-btn');
    if (btn) {
      btn.innerHTML = ALS.icon(dark ? 'sun' : 'moon');
      btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
      btn.title = btn.getAttribute('aria-label');
    }
  };
  if (media && media.addEventListener) media.addEventListener('change', ALS.applyMode);

  function themeMenu() {
    var wrap = ALS.el('div', { class: 'als-menu als-noprint' });
    var btn = ALS.iconBtn('palette', 'Choose design', function (e) {
      e.stopPropagation();
      wrap.setAttribute('data-open', wrap.getAttribute('data-open') === 'true' ? 'false' : 'true');
    });
    btn.setAttribute('aria-haspopup', 'menu');
    var panel = ALS.el('div', { class: 'als-menu-panel', role: 'menu' });
    Object.keys(THEMES).forEach(function (name) {
      var t = THEMES[name];
      var sw = ALS.el('span', { class: 'als-swatch', style: 'background: linear-gradient(135deg,' + t.swatch[0] + ' 50%,' + t.swatch[1] + ' 50%)' });
      var label = ALS.el('span', { html: ALS.esc(t.label) + '<small>' + ALS.esc(t.short || '') + '</small>' });
      panel.appendChild(ALS.el('button', {
        type: 'button', class: 'als-menu-item', role: 'menuitemradio', 'data-theme-option': name,
        onclick: function () { ALS.setTheme(name, true); wrap.setAttribute('data-open', 'false'); }
      }, [sw, label]));
    });
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) wrap.setAttribute('data-open', 'false'); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') wrap.setAttribute('data-open', 'false'); });
    wrap.appendChild(btn); wrap.appendChild(panel);
    return wrap;
  }

  /* Top bar: title, optional actions, theme menu and mode toggle. */
  ALS.topbar = function (actions) {
    var d = ALS.data;
    var bar = ALS.el('header', { class: 'als-topbar' });
    var shell = ALS.el('div', { class: 'als-shell' });
    var brand = ALS.el('div', { class: 'als-brand' }, [
      ALS.el('span', { class: 'als-brand-title', text: d.title }),
      d.subtitle || d.subject ? ALS.el('span', { class: 'als-brand-sub', text: d.subtitle || d.subject }) : null
    ]);
    shell.appendChild(brand);
    shell.appendChild(ALS.el('div', { class: 'als-spacer' }));
    (actions || []).forEach(function (a) { if (a) shell.appendChild(a); });
    shell.appendChild(themeMenu());
    var modeBtn = ALS.iconBtn('moon', 'Toggle dark mode', function () {
      var dark = root.getAttribute('data-als-mode') === 'dark';
      ALS.store.globalSet('mode', dark ? 'light' : 'dark');
      ALS.applyMode();
    }, 'als-noprint');
    modeBtn.id = 'als-mode-btn';
    shell.appendChild(modeBtn);
    bar.appendChild(shell);
    return bar;
  };

  /* Source + grounding badges for an item. */
  ALS.provenance = function (item) {
    if (!item) return null;
    var bits = [];
    if (item.src) bits.push('<span class="als-src" title="Source in your material">' + ALS.esc(item.src) + '</span>');
    if (item.grounded === false) bits.push('<span class="als-beyond" title="Added beyond your course material">beyond your notes</span>');
    if (!bits.length) return null;
    return ALS.el('div', { class: 'als-row als-provenance', html: bits.join(' ') });
  };

  /* Results export shared by the flashcards and trainer templates. */
  ALS.exportResults = function (kind, items, extra) {
    var d = ALS.data;
    var payload = Object.assign({
      als: '1', kind: 'results', source: kind, title: d.title, module: d.module || null,
      date: ALS.today(), exported: new Date().toISOString(), items: items
    }, extra || {});
    var name = (d.module ? d.module + '-' : '') + ALS.slug(d.title) + '-results-' + ALS.today() + '.json';
    ALS.download(name, JSON.stringify(payload, null, 2));
    ALS.toast('Saved ' + name + '. Ask Claude to import it to update your progress.');
  };

  /* ---------------- boot ---------------- */
  ALS.boot = function (render) {
    var node = document.getElementById('als-data');
    try { ALS.data = JSON.parse(node.textContent); }
    catch (e) {
      document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">This page has no valid data block. Rebuild it with <code>als.py build</code>.</p>';
      return;
    }
    ALS.pageKey = ALS.slug((ALS.data.module || '') + '-' + ALS.data.kind + '-' + ALS.data.title);
    ALS.setTheme(ALS.store.get('theme', root.getAttribute('data-als-theme')));
    ALS.applyMode();
    if (ALS.hasMath(node.textContent)) ALS.loadKatex();
    render(ALS.data);
    ALS.applyMode();
    ALS.renderMath(document);
  };
})();
</script>
<script>
ALS.boot(function (lesson) {
  var E = ALS.el, $ = ALS.$, $$ = ALS.$$;
  var app = $('#app');
  var slides = lesson.slides;
  var st = { i: 0, step: 0, notes: ALS.store.get('notes', false), overview: false, playing: false, timer: null, dir: 1 };

  function rich(tag, text, cls) { var n = E(tag, { class: cls || '' }); ALS.rich(n, text); return n; }
  function inlineRich(tag, text, cls) { var n = E(tag, { class: cls || '' }); ALS.rich(n, text, { inline: true }); return n; }
  function stepEl(node) { node.classList.add('ls-step'); return node; }

  function stepCount(s) {
    switch (s.layout) {
      case 'points': case 'summary': return s.points.length;
      case 'steps': return s.steps.length;
      case 'diagram': return Math.max(1, (s.steps || []).length);
      case 'code': return Math.max(1, (s.highlight || []).length, (s.explain || []).length);
      case 'compare': return s.columns.length;
      case 'check': return 2;
      case 'timeline': return s.events.length;
      case 'definition': return s.example ? 2 : 1;
      default: return 1;
    }
  }

  /* ---------- builders: each returns a node; steps are .ls-step elements in order ---------- */
  var build = {
    title: function (s) {
      return E('div', { class: 'ls-title' }, [
        s.kicker || lesson.module ? E('div', { class: 'als-kicker', text: s.kicker || lesson.module }) : null,
        E('h1', { class: 'als-h1', html: ALS.md(s.title || lesson.title, { inline: true }) }),
        s.subtitle || lesson.subtitle ? E('p', { class: 'als-sub', text: s.subtitle || lesson.subtitle }) : null,
        E('div', { class: 'ls-title-meta' }, [
          E('span', { class: 'als-chip', text: slides.length + ' slides' }),
          lesson.subject ? E('span', { class: 'als-chip als-chip--accent', text: lesson.subject }) : null,
          E('span', { class: 'als-chip', html: 'Press <span class="als-kbd">→</span> to begin' })
        ])
      ]);
    },
    points: function (s, summary) {
      var ul = E('ul', { class: 'ls-points ls-big' + (summary ? ' ls-summary' : '') });
      s.points.forEach(function (p, k) {
        var li = E('li', {}, [E('span', { class: 'n', text: summary ? '✓' : String(k + 1).padStart(2, '0') }), inlineRich('div', p)]);
        ul.appendChild(stepEl(li));
      });
      return ul;
    },
    summary: function (s) { return build.points(s, true); },
    steps: function (s) {
      var wrap = E('div', { class: 'ls-deriv' });
      s.steps.forEach(function (row) {
        var r = E('div', { class: 'ls-deriv-row' });
        if (row.text) r.appendChild(inlineRich('div', row.text, 't'));
        if (row.math) { var m = E('div', { class: 'm' }); ALS.rich(m, '$$' + row.math + '$$'); r.appendChild(m); }
        wrap.appendChild(stepEl(r));
      });
      return wrap;
    },
    diagram: function (s) {
      var box = E('div', { class: 'ls-svg' });
      var svg = ALS.safeSvg(s.svg);
      if (svg) box.appendChild(svg); else box.appendChild(E('p', { class: 'als-muted', text: 'Diagram could not be displayed (invalid SVG).' }));
      var cap = E('div', { class: 'ls-caption als-rich' });
      return E('div', { class: 'ls-diagram' }, [box, cap]);
    },
    code: function (s) {
      var lines = ALS.highlight(s.code, s.lang);
      var pre = E('pre', { class: 'als-code' });
      lines.forEach(function (l, k) { pre.appendChild(E('span', { class: 'ln', 'data-line': String(k + 1), html: l })); });
      var kids = [E('div', {}, [s.lang ? E('div', { class: 'als-kicker', style: 'margin-bottom:.5rem', text: s.lang }) : null, pre])];
      var hasExplain = s.explain && s.explain.length;
      if (hasExplain) kids.push(E('div', { class: 'ls-explain als-rich' }));
      return E('div', { class: 'ls-code' + (hasExplain ? ' has-explain' : '') }, kids);
    },
    compare: function (s) {
      var g = E('div', { class: 'ls-compare' });
      s.columns.forEach(function (c) {
        var ul = E('ul'); c.points.forEach(function (p) { ul.appendChild(inlineRich('li', p)); });
        g.appendChild(stepEl(E('div', { class: 'als-card' }, [E('h3', { class: 'als-h3', html: ALS.md(c.heading, { inline: true }) }), ul])));
      });
      return g;
    },
    quote: function (s) {
      return E('figure', { style: 'margin:0' }, [
        E('blockquote', { class: 'ls-quote', html: ALS.md(s.quote, { inline: true }) }),
        s.by ? E('figcaption', { class: 'ls-quote-by', html: '— ' + ALS.md(s.by, { inline: true }) }) : null,
        s.comment ? rich('div', s.comment, 'ls-big als-muted') : null
      ]);
    },
    check: function (s) {
      var opts = E('div', { class: 'ls-options' });
      var fb = stepEl(E('div', { class: 'als-callout als-callout--info', style: 'margin-top:1rem' }));
      s.options.forEach(function (o, k) {
        opts.appendChild(E('button', {
          type: 'button', class: 'als-btn ls-option', 'data-k': String(k),
          html: '<span class="als-mono als-faint">' + String.fromCharCode(65 + k) + '</span>&nbsp;&nbsp;' + ALS.md(o, { inline: true }),
          onclick: function (e) { e.stopPropagation(); answerCheck(s, k); }
        }));
      });
      ALS.rich(fb, '**Answer: ' + String.fromCharCode(65 + s.answer) + '.** ' + (s.explain || ''));
      return E('div', {}, [E('div', { class: 'als-kicker', text: 'Quick check' }), inlineRich('div', s.question, 'ls-big'), opts, fb]);
    },
    timeline: function (s) {
      var t = E('div', { class: 'ls-timeline' });
      s.events.forEach(function (ev) {
        t.appendChild(stepEl(E('div', { class: 'ls-event' }, [E('div', { class: 'when', text: ev.when }), inlineRich('div', ev.what, 'ls-big')])));
      });
      return t;
    },
    definition: function (s) {
      var kids = [E('div', { class: 'als-kicker', text: s.kind || 'Definition' }), E('div', { class: 'ls-term', html: ALS.md(s.term, { inline: true }) }), rich('div', s.definition, 'ls-def')];
      if (s.example) kids.push(stepEl(rich('div', '**Example.** ' + s.example, 'als-callout ls-example')));
      return E('div', {}, kids);
    }
  };

  function answerCheck(s, k) {
    var node = $('#ls-current');
    $$('.ls-option', node).forEach(function (b) {
      var bk = +b.getAttribute('data-k');
      b.classList.toggle('is-right', bk === s.answer);
      b.classList.toggle('is-wrong', bk === k && k !== s.answer);
      b.disabled = true;
    });
    st.step = 1; applySteps();
  }

  function slideNode(s, idx, forPrint) {
    var inner = E('div', { class: 'ls-inner' });
    if (s.layout !== 'title' && s.layout !== 'quote' && s.layout !== 'definition' && s.layout !== 'check') {
      inner.appendChild(E('div', { class: 'als-kicker', style: 'margin-bottom:.5rem', text: (lesson.module ? lesson.module + ' · ' : '') + String(idx + 1).padStart(2, '0') }));
      if (s.title) inner.appendChild(E('h2', { class: 'als-h2', html: ALS.md(s.title, { inline: true }) }));
    }
    var b = build[s.layout] || build.points;
    inner.appendChild(b(s));
    var prov = ALS.provenance(s);
    if (prov) { prov.style.marginTop = '1.5rem'; inner.appendChild(prov); }
    return E('section', { class: 'ls-slide' + (forPrint ? ' ls-print-slide' : ''), 'aria-roledescription': 'slide', 'aria-label': 'Slide ' + (idx + 1) + ' of ' + slides.length }, [inner]);
  }

  /* ---------- step application ---------- */
  function applySteps() {
    var node = $('#ls-current'); if (!node) return;
    var s = slides[st.i];
    var steps = $$('.ls-step', node);
    var showUpTo = s.layout === 'check' ? (st.step >= 1 ? steps.length : 0) : (s.layout === 'definition' ? st.step : st.step + 1);
    steps.forEach(function (el, k) {
      el.classList.toggle('is-hidden', k >= showUpTo);
      el.classList.toggle('is-current', k === showUpTo - 1);
      el.classList.toggle('is-past', s.layout === 'steps' && k < showUpTo - 1);
    });
    if (s.layout === 'check' && st.step >= 1) {
      $$('.ls-option', node).forEach(function (b) { b.disabled = true; if (+b.getAttribute('data-k') === s.answer) b.classList.add('is-right'); });
    }
    if (s.layout === 'diagram') {
      var groups = s.steps || [];
      var all = {}; groups.forEach(function (g) { g.forEach(function (id) { all[id] = 1; }); });
      var visible = {}; groups.slice(0, st.step + 1).forEach(function (g) { g.forEach(function (id) { visible[id] = 1; }); });
      var current = {}; (groups[st.step] || []).forEach(function (id) { current[id] = 1; });
      Object.keys(all).forEach(function (id) {
        var el = node.querySelector('svg [id="' + id.replace(/"/g, '') + '"]');
        if (!el) return;
        el.classList.add('ls-svg-el');
        el.setAttribute('data-ls-hidden', visible[id] ? '0' : '1');
        el.classList.toggle('is-current', !!current[id]);
      });
      var cap = $('.ls-caption', node);
      if (cap) ALS.rich(cap, (s.captions || [])[st.step] || s.caption || '');
    }
    if (s.layout === 'code') {
      var pre = $('.als-code', node);
      var hl = (s.highlight || [])[st.step];
      $$('.ln', pre).forEach(function (ln) { ln.classList.toggle('is-focus', !!hl && hl.indexOf(+ln.getAttribute('data-line')) > -1); });
      pre.classList.toggle('has-focus', !!(hl && hl.length));
      var ex = $('.ls-explain', node);
      if (ex) ALS.rich(ex, (s.explain || [])[st.step] || '');
    }
    var total = slides.reduce(function (a, x) { return a + stepCount(x); }, 0);
    var done = slides.slice(0, st.i).reduce(function (a, x) { return a + stepCount(x); }, 0) + st.step + 1;
    var bar = $('.ls-progress span'); if (bar) bar.style.width = (done / total * 100) + '%';
    var cnt = $('.ls-count'); if (cnt) cnt.textContent = String(st.i + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
    ALS.renderMath(node);
  }

  function go(i, step, dir) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    var changed = i !== st.i || !$('#ls-current');
    st.i = i; st.step = step == null ? 0 : step; st.dir = dir || 1;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* file:// in some browsers */ }
    if (changed || st.overview) { st.overview = false; renderStage(true); } else applySteps();
    ALS.store.set('pos', i);
  }
  function next() {
    var s = slides[st.i];
    if (st.step < stepCount(s) - 1) { st.step++; applySteps(); }
    else if (st.i < slides.length - 1) go(st.i + 1, 0, 1);
    else stopPlay();
  }
  function prev() {
    if (st.step > 0) { st.step--; applySteps(); }
    else if (st.i > 0) go(st.i - 1, stepCount(slides[st.i - 1]) - 1, -1);
  }
  function stopPlay() { st.playing = false; clearInterval(st.timer); var b = $('#ls-play'); if (b) b.innerHTML = ALS.icon('play'); }
  function togglePlay() {
    if (st.playing) return stopPlay();
    st.playing = true; $('#ls-play').innerHTML = ALS.icon('pause');
    st.timer = setInterval(next, (lesson.autoplaySec || 4) * 1000);
  }

  /* ---------- rendering ---------- */
  function renderStage(animate) {
    var stage = $('#ls-stage');
    stage.innerHTML = '';
    if (st.overview) {
      var grid = E('div', { class: 'ls-overview' });
      slides.forEach(function (s, k) {
        grid.appendChild(E('button', { type: 'button', class: 'als-card ls-thumb', 'aria-current': String(k === st.i), onclick: function () { st.overview = false; go(k, 0, 1); } }, [
          E('span', { class: 'n', text: String(k + 1).padStart(2, '0') + ' · ' + s.layout }),
          E('span', { class: 't', html: ALS.md(s.title || s.term || s.question || s.quote || lesson.title, { inline: true }) })
        ]));
      });
      stage.appendChild(grid);
      ALS.renderMath(grid);
      return;
    }
    var node = slideNode(slides[st.i], st.i);
    node.id = 'ls-current';
    if (animate) node.classList.add(st.dir < 0 ? 'ls-anim-back' : 'ls-anim-in');
    stage.appendChild(node);
    var notes = $('#ls-notes');
    if (notes) {
      var n = slides[st.i].notes;
      notes.hidden = !(st.notes && n);
      if (n) ALS.rich(notes, '**Notes.** ' + n);
    }
    applySteps();
  }

  function render() {
    app.innerHTML = '';
    app.appendChild(E('div', { class: 'ls-progress als-noprint' }, [E('span')]));
    app.appendChild(ALS.topbar([
      ALS.iconBtn('print', 'Print or save as PDF (all steps revealed)', printAll, 'als-noprint')
    ]));
    var main = E('main', { class: 'als-shell' }, [E('div', { id: 'ls-stage', class: 'ls-stage' })]);
    app.appendChild(main);
    app.appendChild(E('div', { class: 'als-shell' }, [E('div', { id: 'ls-notes', class: 'ls-notes als-callout als-rich', hidden: true })]));
    var bottom = E('nav', { class: 'ls-bottom als-noprint', 'aria-label': 'Lesson controls' }, [E('div', { class: 'als-shell' }, [
      ALS.iconBtn('left', 'Previous (←)', prev),
      ALS.iconBtn('right', 'Next (→ or Space)', next),
      E('span', { class: 'ls-count' }),
      E('div', { class: 'als-spacer' }),
      (function () { var b = ALS.iconBtn('play', 'Autoplay (P)', togglePlay); b.id = 'ls-play'; return b; })(),
      ALS.iconBtn('notes', 'Speaker notes (N)', toggleNotes),
      ALS.iconBtn('grid', 'Overview (O)', toggleOverview),
      ALS.iconBtn('expand', 'Full screen (F)', fullscreen)
    ])]);
    app.appendChild(bottom);
    renderStage(false);
  }

  function toggleNotes() { st.notes = !st.notes; ALS.store.set('notes', st.notes); renderStage(false); if (st.notes && !slides[st.i].notes) ALS.toast('No notes on this slide'); }
  function toggleOverview() { st.overview = !st.overview; renderStage(true); }
  function fullscreen() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    catch (e) { ALS.toast('Full screen is not available here'); }
  }
  function printAll() {
    var stage = $('#ls-stage');
    stage.innerHTML = '';
    slides.forEach(function (s, k) {
      var n = slideNode(s, k, true);
      stage.appendChild(n);
      if (s.layout === 'diagram' && s.captions) { var cap = $('.ls-caption', n); if (cap) ALS.rich(cap, s.captions.join(' ')); }
      if (s.layout === 'code' && s.explain) { var ex = $('.ls-explain', n); if (ex) ALS.rich(ex, s.explain.join('\n\n')); }
    });
    ALS.renderMath(stage);
    if (new URLSearchParams(location.search).get('print') === '1') return; // headless PDF: leave everything revealed
    setTimeout(function () { window.print(); renderStage(false); }, 250);
  }

  ALS.onKey({
    'ArrowRight': next, ' ': next, 'PageDown': next, 'Enter': next,
    'ArrowLeft': prev, 'PageUp': prev, 'Backspace': prev,
    'Home': function () { go(0, 0, -1); }, 'End': function () { go(slides.length - 1, 0, 1); },
    'n': toggleNotes, 'N': toggleNotes, 'o': toggleOverview, 'O': toggleOverview,
    'f': fullscreen, 'F': fullscreen, 'p': togglePlay, 'P': togglePlay,
    'Escape': function () { if (st.overview) toggleOverview(); }
  });

  // touch swipe
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });

  window.addEventListener('hashchange', function () {
    var h = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(h) && h - 1 !== st.i) go(h - 1, 0, h - 1 > st.i ? 1 : -1);
  });

  var params = new URLSearchParams(location.search);
  var start = parseInt((location.hash || '').slice(1), 10);
  st.i = isNaN(start) ? 0 : Math.max(0, Math.min(slides.length - 1, start - 1));
  render();
  if (params.get('print') === '1') printAll();
});
</script>
</body>
</html>
