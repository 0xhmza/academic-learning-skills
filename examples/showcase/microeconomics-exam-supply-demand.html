<style>/* ALS component contract.
   Every template uses only these classes plus template-specific classes built on the same tokens.
   A theme file defines the tokens (and optional motif overrides) under [data-als-theme="<name>"]. */

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; padding: 0; }
body {

  background-image: var(--pattern, none);
  background-size: var(--pattern-size, auto);
  background-attachment: fixed;
  color: var(--text);

/* ---------- layout ---------- */
.als-shell { width: 100%; max-width: var(--shell-max, 72rem); margin: 0 auto; padding: 0 16px; }
@media (min-width: 720px) { .als-shell { padding: 0 32px; } }

.als-spacer { flex: 1 1 auto; }

.als-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---------- top bar ---------- */
.als-topbar {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 82%, transparent);

.als-h2 { font-family: var(--font-display); font-weight: var(--display-weight, 600); letter-spacing: var(--display-tracking, -0.01em); line-height: 1.2; font-size: clamp(1.35rem, 3vw, 2rem); margin: 0 0 .5rem; text-wrap: balance; }

  border-radius: var(--radius-btn, var(--radius-sm));

.als-btn--bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, transparent); color: var(--bad-text, var(--bad)); }
.als-btn--warn { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn-text, var(--warn)); }
.als-btn--sm { min-height: 2rem; padding: .25rem .65rem; font-size: .8125rem; }
.als-iconbtn { width: 2.5rem; height: 2.5rem; padding: 0; min-height: 0; }

  background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius-sm);

.als-input:focus, .als-select:focus, .als-textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.als-seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--radius-sm); overflow: hidden; }
.als-seg button { border: 0; background: transparent; padding: .35rem .75rem; cursor: pointer; font-size: .8125rem; color: var(--text-muted); }
.als-seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); font-weight: 600; }

.als-chip {
  display: inline-flex; align-items: center; gap: .3rem;

.als-progress > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .35s ease; }

.als-callout--bad { border-left-color: var(--bad); background: var(--bad-soft); }
.als-callout--warn { border-left-color: var(--warn); background: var(--warn-soft); }

/* ---------- menu (theme picker) ---------- */
.als-menu { position: relative; }
.als-menu-panel {
  position: absolute; right: 0; top: calc(100% + .4rem); z-index: 30; min-width: 14rem;
  background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius);

}

.als-menu-item small { display: block; color: var(--text-muted); font-size: .72rem; }
.als-swatch { width: 1.1rem; height: 1.1rem; border-radius: 50%; flex: none; border: 1px solid var(--border-strong); }

/* ---------- toast ---------- */
.als-toast {
  position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 1rem); z-index: 50;
  max-width: calc(100vw - 32px); padding: .6rem 1rem; border-radius: var(--radius-sm);
  background: var(--text-strong, var(--text)); color: var(--bg); font-size: .875rem;

/* ---------- frame (motif hook, styled by themes) ---------- */
.als-frame { min-height: calc(100vh - 3.5rem); padding-top: 2rem; padding-bottom: 4rem; }

/* ---------- rich text ---------- */
.als-rich { overflow-wrap: anywhere; }
.als-rich > :first-child { margin-top: 0; }
.als-rich > :last-child { margin-bottom: 0; }
.als-rich p { margin: 0 0 .75em; }

/* ---------- code blocks ---------- */
.als-code {
  font-family: var(--font-mono); font-size: .875rem; line-height: 1.65;

.als-code.has-focus .ln.is-focus { opacity: 1; background: var(--accent-soft); border-left-color: var(--accent); }
.tok-k { color: var(--code-keyword, var(--accent)); font-weight: 500; }
.tok-s { color: var(--code-string, var(--good)); }
.tok-c { color: var(--text-faint); font-style: italic; }

/* ---------- motion ---------- */
@keyframes als-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes als-fade { from { opacity: 0; } to { opacity: 1; } }

}

/* Blueprint: maths, physics, CS, engineering.
   Inspired by the look of tailwindcss.com: near-black / white, sky accent, Inter + mono labels,
   hairline grid lines, dark code blocks, pill-shaped primary buttons. Colour values come from the
   MIT-licensed Tailwind palette (gray, sky, indigo, emerald, rose, amber). */

[data-als-theme="blueprint"] {
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-features: "cv11", "ss01";
  --display-weight: 600;
  --display-tracking: -0.03em;
  --kicker-tracking: .12em;
  --radius: .75rem;
  --radius-sm: .5rem;
  --radius-btn: 999px;

  --bg: #ffffff;
  --bg-elev: #ffffff;
  --bg-sunken: #f9fafb;
  --text: #030712;
  --text-strong: #030712;
  --text-muted: #4b5563;
  --text-faint: #9ca3af;
  --border: rgb(3 7 18 / .08);
  --border-strong: rgb(3 7 18 / .16);
  --accent: #0284c7;
  --accent-hover: #0369a1;
  --accent-contrast: #ffffff;
  --accent-text: #0369a1;
  --accent-soft: rgb(14 165 233 / .12);
  --accent-2: #6366f1;
  --good: #059669;   --good-text: #047857;  --good-soft: rgb(16 185 129 / .12);
  --bad: #e11d48;    --bad-text: #be123c;   --bad-soft: rgb(244 63 94 / .10);
  --warn: #d97706;   --warn-text: #b45309;  --warn-soft: rgb(245 158 11 / .13);
  --shadow: 0 1px 2px rgb(3 7 18 / .05);
  --pattern:
    linear-gradient(to right, rgb(3 7 18 / .035) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(3 7 18 / .035) 1px, transparent 1px);
  --pattern-size: 40px 40px;

  --code-bg: #0f172a;
  --code-text: #e2e8f0;
  --code-keyword: #f472b6;
  --code-string: #7dd3fc;
  --code-number: #fbbf24;
}

[data-als-theme="blueprint"][data-als-mode="dark"] {
  --bg: #030712;
  --bg-elev: #0b1120;
  --bg-sunken: #111827;
  --text: #f3f4f6;
  --text-strong: #ffffff;
  --text-muted: #9ca3af;
  --text-faint: #6b7280;
  --border: rgb(255 255 255 / .08);
  --border-strong: rgb(255 255 255 / .16);
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --accent-contrast: #030712;
  --accent-text: #7dd3fc;
  --accent-soft: rgb(56 189 248 / .14);
  --accent-2: #818cf8;
  --good: #34d399;   --good-text: #6ee7b7;  --good-soft: rgb(52 211 153 / .13);
  --bad: #fb7185;    --bad-text: #fda4af;   --bad-soft: rgb(251 113 133 / .13);
  --warn: #fbbf24;   --warn-text: #fcd34d;  --warn-soft: rgb(251 191 36 / .13);
  --shadow: none;
  --pattern:
    linear-gradient(to right, rgb(255 255 255 / .03) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(255 255 255 / .03) 1px, transparent 1px);
  --code-bg: #0b1120;
}

/* Motif: primary actions are inverted pills, like the "Get started" button. */
[data-als-theme="blueprint"] .als-btn--primary { background: var(--text-strong); border-color: var(--text-strong); color: var(--bg); }
[data-als-theme="blueprint"] .als-btn--primary:hover { background: var(--text-muted); border-color: var(--text-muted); filter: none; }
/* Motif: hairline frame around the main column on wide screens. */

}
/* Motif: gradient display headings. */
[data-als-theme="blueprint"] .als-h1 .als-grad, [data-als-theme="blueprint"] .als-grad {

  -webkit-background-clip: text; background-clip: text; color: transparent;
}

ve equal (absolute) slopes, so the burden is shared equally. The more inelastic side bears more in general.","marking":["3: new supply curve or wedge set up correctly","3: $P_c$, $P_p$ and $Q$","2: revenue","2: deadweight loss","2: incidence with the elasticity argument"]}]},{"title":"Part C: Short essay","questions":[{"id":"c1","topic":"labour-markets","points":10,"space":"large","prompt":"\"A minimum wage always reduces employment.\" Assess this claim using the competitive model and the monopsony model.","solution":"Competitive labour market: a binding minimum wage above equilibrium raises the wage, lowers quantity demanded, creates unemployment (excess supply). Monopsony: the employer sets employment where MRP = marginal cost of labour, paying a wage below MRP; a minimum wage between the monopsony wage and the competitive wage makes the marginal cost of labour flat at the minimum wage and can **raise** employment. Conclusion: the claim holds in the competitive model but not in general; the empirical answer depends on market power and the level of the minimum wage.","marking":["3: competitive model correctly analysed (diagram or words)","4: monopsony model, including why employment can rise","3: evaluation and justified conclusion"]}]}]}</script>

      paper.appendChild(s);
    });
    if (total) paper.appendChild(E('div', { class: 'ex-total', text: 'Total: ' + total + ' pts' }));
    if (hasSol) paper.appendChild(appendix);
    main.appendChild(paper);
    app.appendChild(main);
    ALS.applyMode();
    ALS.renderMath(app);
  }
  render();
});
</script>
</body>
