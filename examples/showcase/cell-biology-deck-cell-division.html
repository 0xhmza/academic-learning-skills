<script type="application/json" id="als-data">{"als":"1","kind":"deck","title":"Mitosis and meiosis","subtitle":"Cell biology, lecture 6","module":"cell-biology","subject":"Cell biology","sources":[{"id":"L6","title":"Lecture 6: Cell division","locator":"slides 1-40"}],"cards":[{"id":"l6-01","type":"basic","front":"Mitosis vs meiosis: number and ploidy of daughter cells?","back":"Mitosis: 2 diploid cells, genetically identical. Meiosis: 4 haploid cells, genetically different.","tags":["compare"],"topic":"division-overview","src":"L6 s.3"},{"id":"l6-02","type":"cloze","text":"Crossing over between homologous chromosomes happens in {{c1::prophase I}} of meiosis, at sites called {{c2::chiasmata}}.","topic":"meiosis","src":"L6 s.18"},{"id":"l6-03","type":"basic","front":"In which phase do **homologous chromosomes** separate?","back":"Anaphase I of meiosis.","extra":"Sister chromatids stay together until anaphase II.","topic":"meiosis","src":"L6 s.22"},{"id":"l6-04","type":"basic","front":"In which phases do **sister chromatids** separate?","back":"Anaphase of mitosis and anaphase II of meiosis.","topic":"division-overview","src":"L6 s.11"},{"id":"l6-05","type":"reverse","front":"Synapsis","back":"Pairing of homologous chromosomes along their length in prophase I (via the synaptonemal complex)","tags":["definition"],"topic":"meiosis","src":"L6 s.17"},{"id":"l6-06","type":"basic","front":"Two sources of genetic variation produced by meiosis itself?","back":"Crossing over (prophase I) and independent assortment of homologues (metaphase I).","extra":"Random fertilisation adds a third, but it is not part of meiosis.","topic":"meiosis","src":"L6 s.24"},{"id":"l6-07","type":"cloze","text":"The {{c1::kinetochore}} is the protein complex on the centromere where spindle microtubules attach.","topic":"mitosis","src":"L6 s.8"},{"id":"l6-08","type":"basic","front":"What does the spindle assembly checkpoint control?","back":"The metaphase → anaphase transition: anaphase waits until every kinetochore is attached to the spindle.","topic":"regulation","src":"L6 s.30"},{"id":"l6-09","type":"basic","front":"Which enzyme cleaves cohesin to start anaphase, and what activates it?","back":"Separase, activated when the APC/C triggers degradation of securin.","topic":"regulation","src":"L6 s.31"},{"id":"l6-10","type":"basic","front":"Nondisjunction: what is it and one clinical consequence?","back":"Failure of chromosomes to separate correctly in meiosis I or II, giving aneuploid gametes; e.g. trisomy 21 (Down syndrome).","topic":"errors","src":"L6 s.35"},{"id":"l6-11","type":"cloze","text":"Mitosis order: {{c1::prophase}}, {{c2::prometaphase}}, metaphase, {{c3::anaphase}}, telophase.","topic":"mitosis","src":"L6 s.6"},{"id":"l6-12","type":"basic","front":"Why is meiosis called a *reduction* division?","back":"Meiosis I halves the chromosome number (2n → n) by separating homologues; meiosis II then separates sister chromatids like mitosis.","topic":"meiosis","src":"L6 s.15"}]}</script>

    Object.keys(THEMES).forEach(function (name) {
      var t = THEMES[name];
      var sw = ALS.el('span', { class: 'als-swatch', style: 'background: linear-gradient(135deg,' + t.swatch[0] + ' 50%,' + t.swatch[1] + ' 50%)' });
      var label = ALS.el('span', { html: ALS.esc(t.label) + '<small>' + ALS.esc(T(t.short || '')) + '</small>' });

  };
  function hideKey() { return 'hide:' + ((ALS.data && ALS.data.kind) || 'page'); }
  function hiddenList() { return (root.getAttribute('data-als-hide') || '').split(' ').filter(Boolean); }

  /* Top bar: title, optional actions, theme menu and mode toggle. */

  /* ---------------- status bar ----------------

  function seg(cls, title, kids, onclick) {
    return ALS.el(onclick ? 'button' : 'span', { class: 'als-seg-item ' + (cls || ''), title: title || null, type: onclick ? 'button' : null, onclick: onclick || null }, kids);
  }
  function ico(name) { return ALS.el('span', { class: 'i', html: ALS.icon(name) }); }
  ALS.status = function (items) {
    var box = ALS.$('#als-status-info'); if (!box) return;
    box.innerHTML = '';
    (items || []).forEach(function (it) {
      if (!it) return;
      box.appendChild(ALS.el('span', { class: 'als-seg-item' + (it.cls ? ' ' + it.cls : ''), title: it.title || null, html: (it.k ? '<span class="k">' + ALS.esc(it.k) + '</span> ' : '') + '<span class="v">' + ALS.esc(it.v) + '</span>' }));
    });
  };
  function paintTimer() {
    var a = ALS.$('#als-timer'), b = ALS.$('#als-focus'), c = ALS.$('#als-clock .v');
    if (a) {
      ALS.$('.v', a).textContent = ALS.clock(timer.sec);
      a.classList.toggle('is-paused', !timer.running);
      a.title = T('Study time on this page ({0} in total). Click to pause or resume.', ALS.clock(timer.total + timer.sec));
    }
    if (b) {
      var left = timer.focusEnd ? Math.max(0, Math.round((timer.focusEnd - Date.now()) / 1000)) : timer.focusLen;

  }

    if (!document.hidden && timer.running) { timer.sec++; if (timer.sec % 15 === 0) ALS.store.set('time', timer.total + timer.sec); }

    }

  }
  ALS.elapsed = function () { return timer.sec; };
  function applyZoom() {
    var z = parseFloat(ALS.store.globalGet('zoom', '100')) || 100;
    root.style.fontSize = z === 100 ? '' : z + '%';
    var v = ALS.$('#als-zoom-value'); if (v) v.textContent = z + '%';
    setTimeout(function () { ALS.fitMath(document); }, 60);
  }
  function setZoom(delta) {
    var z = delta === 0 ? 100 : Math.round((parseFloat(ALS.store.globalGet('zoom', '100')) || 100) + delta);
    ALS.store.globalSet('zoom', String(Math.max(70, Math.min(180, z))));

  }
  ALS.statusbar = function () {
    var bar = ALS.panel('status', ALS.el('div', { class: 'als-status als-noprint', role: 'toolbar', 'aria-label': T('Status bar') }));
    var left = ALS.el('div', { class: 'als-status-group' });
    others().forEach(function (id) {
      var label = T('Show or hide: {0}', ALS.panels[id]);
      var b = seg('als-seg-btn', label, [ico((PANEL_META[id] || ['panelTop'])[0])], function () { ALS.togglePanel(id); });
      b.setAttribute('data-panel-toggle', id);
      b.setAttribute('aria-label', label);
      left.appendChild(b);
    });
    var zen = seg('als-seg-btn', T('Focus mode: hide all panels (Z)'), [ico('zen')], ALS.zen);
    zen.id = 'als-zen'; zen.setAttribute('aria-label', T('Focus mode: hide all panels (Z)'));
    left.appendChild(zen);
    var info = ALS.el('div', { class: 'als-status-group als-status-info', id: 'als-status-info' });
    var right = ALS.el('div', { class: 'als-status-group als-status-end' });
    var t1 = seg('als-seg-btn', '', [ico('timer'), ALS.el('span', { class: 'v', text: '0:00' })], function () { timer.running = !timer.running; paintTimer(); });
    t1.id = 'als-timer';
    var t2 = seg('als-seg-btn', T('Focus countdown. Click to start or stop a 25-minute block; Shift+click for 50 minutes.'), [ico('target'), ALS.el('span', { class: 'v', text: '25:00' })], function (e) {
      if (timer.focusEnd) timer.focusEnd = 0;
      else { timer.focusLen = (e && e.shiftKey ? 50 : 25) * 60; timer.focusEnd = Date.now() + timer.focusLen * 1000; ALS.toast(T('Focus block started: {0} minutes', timer.focusLen / 60)); }

    });

    var clock = seg('als-hide-sm', T('Time'), [ALS.el('span', { class: 'v', text: '' })]); clock.id = 'als-clock';
    var zv = ALS.el('span', { class: 'v', id: 'als-zoom-value', text: '100%' });
    var zoom = ALS.el('span', { class: 'als-seg-group als-hide-sm' }, [
      seg('als-seg-btn', T('Smaller text'), [ico('minus')], function () { setZoom(-10); }),
      seg('als-seg-btn', T('Reset text size'), [zv], function () { setZoom(0); }),
      seg('als-seg-btn', T('Larger text'), [ico('plus')], function () { setZoom(10); })
    ]);
    var hide = seg('als-seg-btn', T('Hide: {0}', T('Status bar')) + ' (B)', [ico('down')], function () { ALS.togglePanel('status', false); });
    hide.setAttribute('aria-label', T('Hide: {0}', T('Status bar')));
    [t1, t2, clock, zoom, hide].forEach(function (n) { right.appendChild(n); });
    bar.appendChild(left); bar.appendChild(info); bar.appendChild(right);
    return bar;
  };
  ALS.dock = function (controls) {
    var dock = ALS.el('div', { class: 'als-dock als-noprint' });
    (controls || []).forEach(function (c) { if (c) dock.appendChild(c); });
    dock.appendChild(ALS.statusbar());
    var old = ALS.$('.als-handles'); if (old) old.remove();
    var handles = ALS.el('div', { class: 'als-handles als-noprint' });
    Object.keys(ALS.panels).forEach(function (id) {
      var label = T('Show: {0}', ALS.panels[id]);

    });
    document.body.appendChild(handles);
    setTimeout(function () { setHidden(hiddenList(), false); applyZoom(); paintTimer(); }, 0);

  };

  /* Source + grounding badges for an item. */
  ALS.provenance = function (item) {

  };

  /* Results export shared by the flashcards and trainer templates. */
  ALS.exportResults = function (kind, items, extra) {
    var d = ALS.data;
    var payload = Object.assign({
      als: '1', kind: 'results', source: kind, title: d.title, module: d.module || null,

    var name = (d.module ? d.module + '-' : '') + ALS.slug(d.title) + '-results-' + ALS.today() + '.json';

  };

  /* ---------------- boot ---------------- */
  ALS.boot = function (render) {
    var node = document.getElementById('als-data');
    try { ALS.data = JSON.parse(node.textContent); }
    catch (e) {
      document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">This page has no valid data block. Rebuild it with <code>als.py build</code>.</p>';
      return;
    }
    var d = ALS.data;
    ALS.pageKey = ALS.slug((d.module || '') + '-' + d.kind + '-' + d.title);
    ALS.macros = Object.assign({}, d.macros || {}); // LaTeX shorthands defined once per data file
    ALS.autoMathOn = d.autoMath !== false;
    var code = String(d.lang || root.getAttribute('lang') || 'en').toLowerCase();
    ALS.lang = I18N[code] ? code : code.split('-')[0];
    ALS.rtl = d.dir ? d.dir === 'rtl' : !!RTL_LANGS[code.split('-')[0]];
    root.setAttribute('dir', ALS.rtl ? 'rtl' : 'ltr');
    document.title = ALS.plain(d.title);
    var stored = ALS.store.globalGet(hideKey(), null);
    root.setAttribute('data-als-hide', stored != null ? stored : (window.innerWidth < 1000 ? 'sidebar' : ''));
    timer.total = ALS.store.get('time', 0) || 0;
    ALS.setTheme(ALS.store.get('theme', root.getAttribute('data-als-theme')));
    ALS.applyMode();
    if (ALS.hasMath(node.textContent)) ALS.loadKatex();
    ALS.onKey({ 'z': ALS.zen, 'Z': ALS.zen, 'b': function () { ALS.togglePanel('status'); }, 'B': function () { ALS.togglePanel('status'); } });

    ALS.renderMath(document);
  };
})();

<script>
ALS.boot(function (deck) {
  var E = ALS.el, $ = ALS.$, T = ALS.t;
  var app = $('#app');

  /* ---- expand source cards into study cards (cloze -> one per cN, reverse -> two) ---- */
  var CLOZE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
  function clozeNums(text) { var s = {}, m; CLOZE.lastIndex = 0; while ((m = CLOZE.exec(text))) s[m[1]] = 1; return Object.keys(s).sort(function (a, b) { return a - b; }); }
  function clozeSide(text, n, reveal) {
    return text.replace(CLOZE, function (_, num, ans, hint) {
      if (num !== n) return ans;
      return reveal ? '\u0001A' + ans + '\u0001Z' : '\u0001B' + (hint || '…') + '\u0001Z';
    });
  }
  function clozeHtml(s) {
    return ALS.md(s).replace(/\u0001A([\s\S]*?)\u0001Z/g, '<span class="cloze-answer">$1</span>')
      .replace(/\u0001B([\s\S]*?)\u0001Z/g, '<span class="cloze-blank">$1</span>');
  }

  var cards = [];
  deck.cards.forEach(function (c) {
    var base = { src: c.src, grounded: c.grounded, tags: c.tags || [], topic: c.topic, extra: c.extra, origin: c.id };
    if (c.type === 'cloze') {
      clozeNums(c.text).forEach(function (n) {
        cards.push(Object.assign({}, base, { id: c.id + ':c' + n, front: clozeHtml(clozeSide(c.text, n, false)), back: clozeHtml(clozeSide(c.text, n, true)), html: true, kind: 'Cloze' }));
      });
    } else {
      cards.push(Object.assign({}, base, { id: c.id, front: c.front, back: c.back, kind: 'Card' }));
      if (c.type === 'reverse') cards.push(Object.assign({}, base, { id: c.id + ':r', front: c.back, back: c.front, kind: 'Reverse' }));
    }
  });

  var due = Array.isArray(deck._due) ? deck._due : null;
  var tags = {};
  cards.forEach(function (c) { (c.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); if (c.topic) tags['#' + c.topic] = (tags['#' + c.topic] || 0) + 1; });

  var state = {
    view: new URLSearchParams(location.search).get('print') === '1' ? 'browse' : ALS.store.get('view', 'study'),
    filter: due && due.length ? '@due' : 'all',
    shuffle: ALS.store.get('shuffle', true),
    flipped: false, queue: [], pos: 0, results: [], counts: { again: 0, hard: 0, good: 0, easy: 0 }
  };

  function inFilter(c) {
    if (state.filter === 'all') return true;
    if (state.filter === '@due') return due.indexOf(c.origin) > -1 || due.indexOf(c.id) > -1;
    if (state.filter.charAt(0) === '#') return c.topic === state.filter.slice(1);
    return (c.tags || []).indexOf(state.filter) > -1;
  }

  function startSession(onlyIds) {
    var pool = cards.filter(function (c) { return onlyIds ? onlyIds.indexOf(c.id) > -1 : inFilter(c); });
    state.queue = state.shuffle ? ALS.shuffle(pool) : pool;
    state.pos = 0; state.flipped = false; state.results = []; state.counts = { again: 0, hard: 0, good: 0, easy: 0 };
    render();
  }

  /* ---- face rendering ---- */
  function face(card, side) {
    var isBack = side === 'back';
    var text = isBack ? card.back : card.front;
    var body = E('div', { class: 'fc-body' });
    if (card.html) { body.innerHTML = text; body.classList.add('als-rich'); }
    else ALS.rich(body, text);
    if (String(text || '').length > 220) body.classList.add('is-long');
    var foot = E('div', { class: 'fc-foot' });
    var prov = ALS.provenance(card);
    foot.appendChild(prov || E('span'));
    if (!isBack) foot.appendChild(E('span', { class: 'fc-hint', text: T('Tap or press Space to flip') }));
    var kids = [E('div', { class: 'fc-label', text: isBack ? T('Answer') : (card.kind === 'Cloze' ? T('Fill the gap') : card.kind === 'Reverse' ? T('Reverse') : T('Question')) }), body];
    if (isBack && card.extra) { var ex = E('div', { class: 'fc-extra' }); ALS.rich(ex, card.extra); kids.push(ex); }
    kids.push(foot);
    return E('div', { class: 'fc-face fc-' + side }, kids);
  }

  function flip() {
    var el = $('#fc-card'); if (!el) return;
    state.flipped = !state.flipped;
    el.classList.toggle('is-flipped', state.flipped);
    el.setAttribute('aria-label', state.flipped ? T('Answer side. Press 1 to 4 to grade.') : T('Question side. Press Space to show the answer.'));
    var g = $('#fc-grades'); if (g) g.hidden = !state.flipped;
    var fb = $('#fc-flipbar'); if (fb) fb.hidden = state.flipped;
  }

  function grade(g) {
    if (!state.flipped || state.view !== 'study') return;
    var card = state.queue[state.pos];
    state.results.push({ id: card.origin, card: card.id, topic: card.topic || null, grade: g, correct: g !== 'again', at: new Date().toISOString() });
    state.counts[g]++;
    if (g === 'again') {
      // relearn: re-insert a few cards later in this session
      var at = Math.min(state.queue.length, state.pos + 4);
      state.queue.splice(at, 0, card);
    }
    state.pos++; state.flipped = false;
    ALS.store.set('last', { date: ALS.today(), counts: state.counts });
    render();
  }

  /* ---- views ---- */
  function header() {
    var seg = E('div', { class: 'als-seg', role: 'group', 'aria-label': 'View' }, ['study', 'browse'].map(function (v) {
      return E('button', { type: 'button', 'aria-pressed': String(state.view === v), text: v === 'study' ? T('Study') : T('Browse all'), onclick: function () { state.view = v; ALS.store.set('view', v); render(); } });
    }));
    var shuf = E('button', { type: 'button', class: 'als-btn als-btn--sm', 'aria-pressed': String(state.shuffle), html: ALS.icon('shuffle') + ' ' + (state.shuffle ? T('Shuffled') : T('In order')), onclick: function () { state.shuffle = !state.shuffle; ALS.store.set('shuffle', state.shuffle); startSession(); } });
    shuf.querySelector('svg').style.width = '1rem';
    return E('div', { class: 'fc-head' }, [
      E('div', {}, [
        E('div', { class: 'als-kicker', text: (deck.module ? deck.module + ' · ' : '') + T('{0} cards', cards.length) }),
        E('h1', { class: 'als-h1', text: deck.title }),
        deck.subtitle ? E('p', { class: 'als-sub', text: deck.subtitle }) : null
      ]),
      E('div', { class: 'fc-controls als-noprint' }, [seg, shuf])
    ]);
  }

  function filters() {
    var keys = Object.keys(tags).sort();
    if (!keys.length && !due) return null;
    var mk = function (val, label, count) {
      return E('button', { type: 'button', class: 'als-chip', 'aria-pressed': String(state.filter === val), text: label + (count != null ? ' · ' + count : ''), onclick: function () { state.filter = val; startSession(); } });
    };
    var row = [mk('all', T('All'), cards.length)];
    if (due) row.push(mk('@due', T('Due today'), cards.filter(function (c) { return due.indexOf(c.origin) > -1 || due.indexOf(c.id) > -1; }).length));
    keys.forEach(function (k) { row.push(mk(k, k.charAt(0) === '#' ? k.slice(1) : k, tags[k])); });
    return E('div', { class: 'fc-filters als-noprint', role: 'group', 'aria-label': 'Filter cards' }, row);
  }

  function studyView() {
    var wrap = E('div');
    if (state.pos >= state.queue.length) return doneView();
    var card = state.queue[state.pos];
    var total = state.queue.length;
    var pct = Math.round(state.pos / total * 100);
    wrap.appendChild(E('div', { class: 'fc-meta' }, [
      E('span', { text: T('Card {0} of {1}', state.pos + 1, total) }),
      E('span', { text: T('{0} again · {1} recalled', state.counts.again, state.counts.good + state.counts.easy + state.counts.hard) })
    ]));
    var bar = E('div', { class: 'als-progress', style: 'margin-bottom:1rem' }, [E('span', { style: 'width:' + pct + '%' })]);
    wrap.appendChild(bar);
    var cardEl = E('div', { id: 'fc-card', class: 'fc-card als-rise', tabindex: '0', role: 'button', 'aria-label': T('Question side. Press Space to show the answer.'), onclick: flip }, [face(card, 'front'), face(card, 'back')]);
    wrap.appendChild(E('div', { class: 'fc-stage' }, [cardEl]));
    wrap.appendChild(E('div', { id: 'fc-flipbar', class: 'fc-flipbar als-noprint' }, [
      E('button', { type: 'button', class: 'als-btn als-btn--primary', html: ALS.icon('rotate') + ' ' + T('Show answer'), onclick: flip })
    ]));
    var g = E('div', { id: 'fc-grades', class: 'fc-grades als-noprint', hidden: true }, [
      E('button', { type: 'button', class: 'als-btn als-btn--bad', onclick: function () { grade('again'); }, html: T('Again') + '<small>' + T('forgot') + ' · 1</small>' }),
      E('button', { type: 'button', class: 'als-btn als-btn--warn', onclick: function () { grade('hard'); }, html: T('Hard') + '<small>' + T('struggled') + ' · 2</small>' }),
      E('button', { type: 'button', class: 'als-btn als-btn--good', onclick: function () { grade('good'); }, html: T('Good') + '<small>' + T('recalled') + ' · 3</small>' }),
      E('button', { type: 'button', class: 'als-btn', onclick: function () { grade('easy'); }, html: T('Easy') + '<small>' + T('instant') + ' · 4</small>' })
    ]);
    wrap.appendChild(g);
    wrap.appendChild(E('div', { class: 'fc-keys als-noprint', html: '<span class="als-kbd">Space</span> ' + T('flip') + ' &nbsp; <span class="als-kbd">1</span><span class="als-kbd">2</span><span class="als-kbd">3</span><span class="als-kbd">4</span> ' + T('grade') }));
    return wrap;
  }

  function doneView() {
    var c = state.counts, n = state.results.length;
    var againIds = {}; state.results.forEach(function (r) { if (r.grade === 'again') againIds[r.card] = 1; });
    var again = Object.keys(againIds);
    var box = E('div', { class: 'fc-done als-card als-rise' }, [
      E('div', { class: 'als-kicker', text: T('Session complete') }),
      E('h2', { class: 'als-h2', text: n ? T('Nice work.') : T('Nothing to review here.') }),
      E('p', { class: 'als-muted', text: n ? T('Save your results and ask Claude to import them; it schedules each card for its next review.') : T('Pick another filter or browse all cards.') }),
      E('div', { class: 'fc-stats' }, [['again', 'Again'], ['hard', 'Hard'], ['good', 'Good'], ['easy', 'Easy']].map(function (p) {
        return E('div', { class: 'fc-stat' }, [E('b', { text: String(c[p[0]]) }), E('span', { text: T(p[1]) })]);
      })),
      E('div', { class: 'als-row', style: 'justify-content:center' }, [
        n ? E('button', { type: 'button', class: 'als-btn als-btn--primary', html: ALS.icon('download') + ' ' + T('Save results'), onclick: function () { ALS.exportResults('deck', state.results); } }) : null,
        again.length ? E('button', { type: 'button', class: 'als-btn', text: T('Review {0} missed', again.length), onclick: function () { startSession(again); } }) : null,
        E('button', { type: 'button', class: 'als-btn', text: T('Restart'), onclick: function () { startSession(); } })
      ])
    ]);
    return box;
  }

  function browseView() {
    var grid = E('div', { class: 'fc-browse' });
    cards.filter(inFilter).forEach(function (card) {
      var el = E('div', { class: 'fc-card', tabindex: '0', role: 'button', 'aria-label': T('Flashcard, press Enter to flip') }, [face(card, 'front'), face(card, 'back')]);
      var toggle = function () { el.classList.toggle('is-flipped'); };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); } });
      grid.appendChild(E('div', { class: 'fc-mini' }, [el]));
    });
    return grid;
  }

  function render() {
    app.innerHTML = '';
    var printBtn = ALS.iconBtn('print', T('Print all cards'), function () { state.view = 'browse'; render(); setTimeout(function () { window.print(); }, 150); }, 'als-noprint');
    app.appendChild(ALS.topbar([printBtn]));
    var main = E('main', { class: 'als-shell als-frame' });
    main.appendChild(header());
    var f = filters(); if (f) main.appendChild(f);
    main.appendChild(state.view === 'study' ? studyView() : browseView());
    app.appendChild(main);
    app.appendChild(ALS.dock());
    paintStatus();
    ALS.applyMode();
    ALS.renderMath(app);
  }
  function paintStatus() {
    var done = state.results.length, ok = state.counts.hard + state.counts.good + state.counts.easy;
    ALS.status([
      { k: T('Card'), v: Math.min(state.pos + 1, state.queue.length) + ' / ' + state.queue.length },
      { k: T('Recalled'), v: ok }, { k: T('Again'), v: state.counts.again },
      done ? { k: T('Accuracy'), v: Math.round(ok / done * 100) + '%' } : null,
      done && ALS.elapsed() > 20 ? { k: T('Pace'), v: (done / (ALS.elapsed() / 60)).toFixed(1) + ' / ' + T('min') } : null
    ]);
  }

  ALS.onKey({
    ' ': function () { if (state.view === 'study') flip(); },
    'Enter': function () { if (state.view === 'study') flip(); },
    '1': function () { grade('again'); }, '2': function () { grade('hard'); },
    '3': function () { grade('good'); }, '4': function () { grade('easy'); }
  });

  startSession();
});
</script>
</body>
</html>
