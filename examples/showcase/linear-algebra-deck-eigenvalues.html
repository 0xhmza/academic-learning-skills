<style>/* ALS component contract.

.als-callout--warn { border-left-color: var(--warn); background: var(--warn-soft); }

.als-menu { position: relative; }
.als-menu-panel {
  position: absolute; right: 0; top: calc(100% + .4rem); z-index: 30; min-width: 14rem;
  background: var(--bg-elev); border: 1px solid var(--border-strong); border-radius: var(--radius);

}

.als-swatch { width: 1.1rem; height: 1.1rem; border-radius: 50%; flex: none; border: 1px solid var(--border-strong); }

/* ---------- toast ---------- */
.als-toast {

/* ---------- frame (motif hook, styled by themes) ---------- */
.als-frame { min-height: calc(100vh - 3.5rem); padding-top: 2rem; padding-bottom: 4rem; }

.als-rich { overflow-wrap: anywhere; }

.als-rich > :last-child { margin-bottom: 0; }

.als-code {

/* ---------- motion ---------- */
@keyframes als-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Blueprint: maths, physics, CS, engineering.
   Inspired by the look of tailwindcss.com: near-black / white, sky accent, Inter + mono labels,
   hairline grid lines, dark code blocks, pill-shaped primary buttons. Colour values come from the
   MIT-licensed Tailwind palette (gray, sky, indigo, emerald, rose, amber). */

[data-als-theme="blueprint"] {
  --font-body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-display: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --font-features: "cv11", "ss01";
  --display-weight: 600;
  --display-tracking: -0.03em;
  --kicker-tracking: .12em;
  --radius: .75rem;
  --radius-sm: .5rem;
  --radius-btn: 999px;

  --bg: #ffffff;
  --bg-elev: #ffffff;
  --bg-sunken: #f9fafb;
  --text: #030712;
  --text-strong: #030712;
  --text-muted: #4b5563;
  --text-faint: #9ca3af;
  --border: rgb(3 7 18 / .08);
  --border-strong: rgb(3 7 18 / .16);
  --accent: #0284c7;
  --accent-hover: #0369a1;
  --accent-contrast: #ffffff;
  --accent-text: #0369a1;
  --accent-soft: rgb(14 165 233 / .12);
  --accent-2: #6366f1;
  --good: #059669;   --good-text: #047857;  --good-soft: rgb(16 185 129 / .12);
  --bad: #e11d48;    --bad-text: #be123c;   --bad-soft: rgb(244 63 94 / .10);
  --warn: #d97706;   --warn-text: #b45309;  --warn-soft: rgb(245 158 11 / .13);
  --shadow: 0 1px 2px rgb(3 7 18 / .05);
  --pattern:
    linear-gradient(to right, rgb(3 7 18 / .035) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(3 7 18 / .035) 1px, transparent 1px);
  --pattern-size: 40px 40px;

  --code-bg: #0f172a;
  --code-text: #e2e8f0;
  --code-keyword: #f472b6;
  --code-string: #7dd3fc;
  --code-number: #fbbf24;
}

[data-als-theme="blueprint"][data-als-mode="dark"] {
  --bg: #030712;
  --bg-elev: #0b1120;
  --bg-sunken: #111827;
  --text: #f3f4f6;

  --text-muted: #9ca3af;
  --text-faint: #6b7280;
  --border: rgb(255 255 255 / .08);
  --border-strong: rgb(255 255 255 / .16);
  --accent: #38bdf8;
  --accent-hover: #7dd3fc;
  --accent-contrast: #030712;
  --accent-text: #7dd3fc;
  --accent-soft: rgb(56 189 248 / .14);
  --accent-2: #818cf8;
  --good: #34d399;   --good-text: #6ee7b7;  --good-soft: rgb(52 211 153 / .13);
  --bad: #fb7185;    --bad-text: #fda4af;   --bad-soft: rgb(251 113 133 / .13);
  --warn: #fbbf24;   --warn-text: #fcd34d;  --warn-soft: rgb(251 191 36 / .13);
  --shadow: none;
  --pattern:
    linear-gradient(to right, rgb(255 255 255 / .03) 1px, transparent 1px),
    linear-gradient(to bottom, rgb(255 255 255 / .03) 1px, transparent 1px);
  --code-bg: #0b1120;
}

/* Motif: primary actions are inverted pills, like the "Get started" button. */
[data-als-theme="blueprint"] .als-btn--primary { background: var(--text-strong); border-color: var(--text-strong); color: var(--bg); }
[data-als-theme="blueprint"] .als-btn--primary:hover { background: var(--text-muted); border-color: var(--text-muted); filter: none; }
/* Motif: hairline frame around the main column on wide screens. */

}
/* Motif: gradient display headings. */
[data-als-theme="blueprint"] .als-h1 .als-grad, [data-als-theme="blueprint"] .als-grad {

  .cloze-answer { background: var(--accent-soft); color: var(--accent-text, var(--accent)); border-radius: 4px; padding: 0 .25em; font-weight: 600; }
  .fc-grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; max-width: 46rem; margin: 1rem auto 0; }

"front":"$A$ is invertible with eigenpair $(\\lambda, \\mathbf v)$. An eigenpair of $A^{-1}$?","back":"$(1/\\lambda, \\mathbf v)$.","topic":"eigen","src":"L7 s.24"},{"id":"l7-09","type":"reverse","front":"Eigenspace $E_\\lambda$","back":"$\\ker(A - \\lambda I)$: all eigenvectors for $\\lambda$ together with $\\mathbf 0$","tags":["definition"],"topic":"eigen","src":"L7 s.16"},{"id":"l7-10","type":"cloze","text":"{{c1::Algebraic}} multiplicity counts $\\lambda$ as a root of the characteristic polynomial; {{c2::geometric}} multiplicity is $\\dim E_\\lambda$.","tags":["definition"],"topic":"diagonalisation","src":"L7 s.26"},{"id":"l7-11","type":"basic","front":"When is an $n\\times n$ matrix diagonalisable?","back":"Exactly when it has $n$ linearly independent eigenvectors (equivalently, geometric = algebraic multiplicity for every eigenvalue).","topic":"diagonalisation","src":"L7 s.27"},{"id":"l7-12","type":"basic","front":"Standard example of a non-diagonalisable $2\\times 2$ matrix?","back":"The shear $\\begin{pmatrix} 1 & 1 \\\\ 0 & 1 \\end{pmatrix}$: eigenvalue 1 twice, but only one eigenvector direction.","topic":"diagonalisation","src":"L7 s.28"},{"id":"l7-13","type":"basic","front":"Two facts about the eigen-structure of a real symmetric matrix?","back":"All eigenvalues are real, and there is an orthonormal basis of eigenvectors (spectral theorem).","topic":"spectral","grounded":false}]}</script>

<script>
ALS.boot(function (deck) {
  var E = ALS.el, $ = ALS.$;
  var app = $('#app');

  /* ---- expand source cards into study cards (cloze -> one per cN, reverse -> two) ---- */
  var CLOZE = /\{\{c(\d+)::([\s\S]*?)(?:::([\s\S]*?))?\}\}/g;
  function clozeNums(text) { var s = {}, m; CLOZE.lastIndex = 0; while ((m = CLOZE.exec(text))) s[m[1]] = 1; return Object.keys(s).sort(function (a, b) { return a - b; }); }

    return text.replace(CLOZE, function (_, num, ans, hint) {
      if (num !== n) return ans;
      return reveal ? '\u0001A' + ans + '\u0001Z' : '\u0001B' + (hint || '…') + '\u0001Z';
    });
  }
  function clozeHtml(s) {
    return ALS.md(s).replace(/\u0001A([\s\S]*?)\u0001Z/g, '<span class="cloze-answer">$1</span>')
      .replace(/\u0001B([\s\S]*?)\u0001Z/g, '<span class="cloze-blank">$1</span>');
  }

  var cards = [];
  deck.cards.forEach(function (c) {
    var base = { src: c.src, grounded: c.grounded, tags: c.tags || [], topic: c.topic, extra: c.extra, origin: c.id };
    if (c.type === 'cloze') {
      clozeNums(c.text).forEach(function (n) {
        cards.push(Object.assign({}, base, { id: c.id + ':c' + n, front: clozeHtml(clozeSide(c.text, n, false)), back: clozeHtml(clozeSide(c.text, n, true)), html: true, kind: 'Cloze' }));
      });
    } else {
      cards.push(Object.assign({}, base, { id: c.id, front: c.front, back: c.back, kind: 'Card' }));
      if (c.type === 'reverse') cards.push(Object.assign({}, base, { id: c.id + ':r', front: c.back, back: c.front, kind: 'Reverse' }));
    }
  });

  var due = Array.isArray(deck._due) ? deck._due : null;
  var tags = {};
  cards.forEach(function (c) { (c.tags || []).forEach(function (t) { tags[t] = (tags[t] || 0) + 1; }); if (c.topic) tags['#' + c.topic] = (tags['#' + c.topic] || 0) + 1; });

  var state = {
    view: new URLSearchParams(location.search).get('print') === '1' ? 'browse' : ALS.store.get('view', 'study'),
    filter: due && due.length ? '@due' : 'all',
    shuffle: ALS.store.get('shuffle', true),
    flipped: false, queue: [], pos: 0, results: [], counts: { again: 0, hard: 0, good: 0, easy: 0 }
  };

  function inFilter(c) {
    if (state.filter === 'all') return true;
    if (state.filter === '@due') return due.indexOf(c.origin) > -1 || due.indexOf(c.id) > -1;
    if (state.filter.charAt(0) === '#') return c.topic === state.filter.slice(1);
    return (c.tags || []).indexOf(state.filter) > -1;
  }

  function startSession(onlyIds) {
    var pool = cards.filter(function (c) { return onlyIds ? onlyIds.indexOf(c.id) > -1 : inFilter(c); });
    state.queue = state.shuffle ? ALS.shuffle(pool) : pool;

    render();
  }

  /* ---- face rendering ---- */
  function face(card, side) {
    var isBack = side === 'back';
    var text = isBack ? card.back : card.front;
    var body = E('div', { class: 'fc-body' });
    if (card.html) { body.innerHTML = text; body.classList.add('als-rich'); }
    else ALS.rich(body, text);
    if (String(text || '').length > 220) body.classList.add('is-long');
    var foot = E('div', { class: 'fc-foot' });
    var prov = ALS.provenance(card);
    foot.appendChild(prov || E('span'));
    if (!isBack) foot.appendChild(E('span', { class: 'fc-hint', text: 'Tap or press Space to flip' }));
    var kids = [E('div', { class: 'fc-label', text: isBack ? 'Answer' : (card.kind === 'Cloze' ? 'Fill the gap' : card.kind === 'Reverse' ? 'Reverse' : 'Question') }), body];
    if (isBack && card.extra) { var ex = E('div', { class: 'fc-extra' }); ALS.rich(ex, card.extra); kids.push(ex); }
    kids.push(foot);
    return E('div', { class: 'fc-face fc-' + side }, kids);
  }

  function flip() {
    var el = $('#fc-card'); if (!el) return;
    state.flipped = !state.flipped;

    var g = $('#fc-grades'); if (g) g.hidden = !state.flipped;
    var fb = $('#fc-flipbar'); if (fb) fb.hidden = state.flipped;
  }

  function grade(g) {
    if (!state.flipped || state.view !== 'study') return;
    var card = state.queue[state.pos];
    state.results.push({ id: card.origin, card: card.id, topic: card.topic || null, grade: g, correct: g !== 'again', at: new Date().toISOString() });

      // relearn: re-insert a few cards later in this session
      var at = Math.min(state.queue.length, state.pos + 4);
      state.queue.splice(at, 0, card);

    state.pos++; state.flipped = false;

  }

  /* ---- views ---- */
  function header() {

      return E('button', { type: 'button', 'aria-pressed': String(state.view === v), text: v === 'study' ? 'Study' : 'Browse all', onclick: function () { state.view = v; ALS.store.set('view', v); render(); } });
    }));
    var shuf = E('button', { type: 'button', class: 'als-btn als-btn--sm', 'aria-pressed': String(state.shuffle), html: ALS.icon('shuffle') + (state.shuffle ? ' Shuffled' : ' In order'), onclick: function () { state.shuffle = !state.shuffle; ALS.store.set('shuffle', state.shuffle); startSession(); } });
    shuf.querySelector('svg').style.width = '1rem';
    return E('div', { class: 'fc-head' }, [
      E('div', {}, [
        E('div', { class: 'als-kicker', text: (deck.module ? deck.module + ' · ' : '') + cards.length + ' cards' }),
        E('h1', { class: 'als-h1', text: deck.title }),
        deck.subtitle ? E('p', { class: 'als-sub', text: deck.subtitle }) : null
      ]),
      E('div', { class: 'fc-controls als-noprint' }, [seg, shuf])
    ]);
  }

  function filters() {
    var keys = Object.keys(tags).sort();
    if (!keys.length && !due) return null;
    var mk = function (val, label, count) {
      return E('button', { type: 'button', class: 'als-chip', 'aria-pressed': String(state.filter === val), text: label + (count != null ? ' · ' + count : ''), onclick: function () { state.filter = val; startSession(); } });
    };
    var row = [mk('all', 'All', cards.length)];
    if (due) row.push(mk('@due', 'Due today', cards.filter(function (c) { return due.indexOf(c.origin) > -1 || due.indexOf(c.id) > -1; }).length));
    keys.forEach(function (k) { row.push(mk(k, k.charAt(0) === '#' ? k.slice(1) : k, tags[k])); });
    return E('div', { class: 'fc-filters als-noprint', role: 'group', 'aria-label': 'Filter cards' }, row);
  }

  function studyView() {
    var wrap = E('div');
    if (state.pos >= state.queue.length) return doneView();
    var card = state.queue[state.pos];
    var total = state.queue.length;
    var pct = Math.round(state.pos / total * 100);
    wrap.appendChild(E('div', { class: 'fc-meta' }, [
      E('span', { text: 'Card ' + (state.pos + 1) + ' of ' + total }),
      E('span', { text: state.counts.again + ' again · ' + (state.counts.good + state.counts.easy + state.counts.hard) + ' recalled' })
    ]));
    var bar = E('div', { class: 'als-progress', style: 'margin-bottom:1rem' }, [E('span', { style: 'width:' + pct + '%' })]);
    wrap.appendChild(bar);
    var cardEl = E('div', { id: 'fc-card', class: 'fc-card als-rise', tabindex: '0', role: 'button', 'aria-label': 'Question side. Press Space to show the answer.', onclick: flip }, [face(card, 'front'), face(card, 'back')]);
    wrap.appendChild(E('div', { class: 'fc-stage' }, [cardEl]));
    wrap.appendChild(E('div', { id: 'fc-flipbar', class: 'fc-flipbar als-noprint' }, [
      E('button', { type: 'button', class: 'als-btn als-btn--primary', html: ALS.icon('rotate') + ' Show answer', onclick: flip })
    ]));
    var g = E('div', { id: 'fc-grades', class: 'fc-grades als-noprint', hidden: true }, [
      E('button', { type: 'button', class: 'als-btn als-btn--bad', onclick: function () { grade('again'); }, html: 'Again<small>forgot · 1</small>' }),
      E('button', { type: 'button', class: 'als-btn als-btn--warn', onclick: function () { grade('hard'); }, html: 'Hard<small>struggled · 2</small>' }),
      E('button', { type: 'button', class: 'als-btn als-btn--good', onclick: function () { grade('good'); }, html: 'Good<small>recalled · 3</small>' }),
      E('button', { type: 'button', class: 'als-btn', onclick: function () { grade('easy'); }, html: 'Easy<small>instant · 4</small>' })
    ]);
    wrap.appendChild(g);
    wrap.appendChild(E('div', { class: 'fc-keys als-noprint', html: '<span class="als-kbd">Space</span> flip &nbsp; <span class="als-kbd">1</span><span class="als-kbd">2</span><span class="als-kbd">3</span><span class="als-kbd">4</span> grade' }));
    return wrap;
  }

  function doneView() {
    var c = state.counts, n = state.results.length;
    var againIds = {}; state.results.forEach(function (r) { if (r.grade === 'again') againIds[r.card] = 1; });
    var again = Object.keys(againIds);
    var box = E('div', { class: 'fc-done als-card als-rise' }, [
      E('div', { class: 'als-kicker', text: 'Session complete' }),
      E('h2', { class: 'als-h2', text: n ? 'Nice work.' : 'Nothing to review here.' }),
      E('p', { class: 'als-muted', text: n ? 'Save your results and ask Claude to import them; it schedules each card for its next review.' : 'Pick another filter or browse all cards.' }),
      E('div', { class: 'fc-stats' }, [['again', 'Again'], ['hard', 'Hard'], ['good', 'Good'], ['easy', 'Easy']].map(function (p) {
        return E('div', { class: 'fc-stat' }, [E('b', { text: String(c[p[0]]) }), E('span', { text: p[1] })]);
      })),
      E('div', { class: 'als-row', style: 'justify-content:center' }, [
        n ? E('button', { type: 'button', class: 'als-btn als-btn--primary', html: ALS.icon('download') + ' Save results', onclick: function () { ALS.exportResults('deck', state.results); } }) : null,
        again.length ? E('button', { type: 'button', class: 'als-btn', text: 'Review ' + again.length + ' missed', onclick: function () { startSession(again); } }) : null,
        E('button', { type: 'button', class: 'als-btn', text: 'Restart', onclick: function () { startSession(); } })
      ])
    ]);
    return box;
  }

  function browseView() {
    var grid = E('div', { class: 'fc-browse' });
    cards.filter(inFilter).forEach(function (card) {
      var el = E('div', { class: 'fc-card', tabindex: '0', role: 'button', 'aria-label': 'Flashcard, press Enter to flip' }, [face(card, 'front'), face(card, 'back')]);
      var toggle = function () { el.classList.toggle('is-flipped'); };
      el.addEventListener('click', toggle);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopPropagation(); toggle(); } });
      grid.appendChild(E('div', { class: 'fc-mini' }, [el]));
    });
    return grid;
  }

  function render() {
    app.innerHTML = '';
    var printBtn = ALS.iconBtn('print', 'Print all cards', function () { state.view = 'browse'; render(); setTimeout(function () { window.print(); }, 150); }, 'als-noprint');
    app.appendChild(ALS.topbar([printBtn]));
    var main = E('main', { class: 'als-shell als-frame' });
    main.appendChild(header());
    var f = filters(); if (f) main.appendChild(f);
    main.appendChild(state.view === 'study' ? studyView() : browseView());
    app.appendChild(main);
    ALS.applyMode();
    ALS.renderMath(app);
  }

  ALS.onKey({
    ' ': function () { if (state.view === 'study') flip(); },
    'Enter': function () { if (state.view === 'study') flip(); },
    '1': function () { grade('again'); }, '2': function () { grade('hard'); },
    '3': function () { grade('good'); }, '4': function () { grade('easy'); }
  });

  startSession();
});
</script>
</body>
</html>
