<!doctype html>
<html lang="{{lang}}" dir="{{dir}}" data-als-theme="{{theme}}" data-als-default="{{theme}}" data-als-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="generator" content="academic-learning-skills {{version}} · lesson">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/*ALS:EARLY*/</script>
<style>/*ALS:CSS*/</style>
<style>
  html, body { overflow-x: clip; } /* slide-in animation must never cause a horizontal scrollbar */
  html { --als-dir: 1; } html[dir="rtl"] { --als-dir: -1; }
  .ls-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; background: transparent; }
  .ls-progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }

  /* workspace: outline sidebar + stage */
  .ls-work { display: flex; flex: 1 0 auto; min-height: 0; align-items: stretch; }
  .ls-side { flex: none; width: 17rem; border-inline-end: 1px solid var(--border); background: color-mix(in srgb, var(--bg-elev) 70%, transparent); }
  .ls-side-in { position: sticky; top: 3.3rem; max-height: calc(100vh - 3.3rem - 5.4rem); overflow-y: auto; padding: .9rem .6rem 1.5rem; }
  [data-als-hide~="header"] .ls-side-in { top: 0; max-height: calc(100vh - 5.4rem); }
  .ls-side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 .4rem .5rem; }
  .ls-out { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
  .ls-out button { display: grid; grid-template-columns: 1.6rem 1fr; gap: .35rem; width: 100%; text-align: start; border: 0; background: none; color: var(--text-muted); padding: .32rem .4rem; border-radius: var(--radius-sm); cursor: pointer; font-size: .82rem; line-height: 1.35; }
  .ls-out button:hover { background: var(--bg-sunken); color: var(--text); }
  .ls-out button .n { font-family: var(--font-mono); font-size: .68rem; color: var(--text-faint); padding-top: .12rem; }
  .ls-out li.is-seen button .n { color: var(--good); }
  .ls-out li.is-current button { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .ls-out li.is-current button .n { color: var(--accent-text, var(--accent)); }
  .ls-out li.is-section { margin-top: .7rem; }
  .ls-out li.is-section button { font-family: var(--font-display); font-weight: var(--display-weight, 600); color: var(--text); font-size: .86rem; }
  .ls-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  @media (max-width: 900px) {
    .ls-side { position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 35; width: min(86vw, 19rem); background: var(--bg-elev); box-shadow: 0 0 60px rgba(0,0,0,.35); }
    .ls-side-in { top: 0; max-height: 100vh; }
  }

  .ls-stage { flex: 1 0 auto; display: flex; align-items: center; justify-content: center; padding: 1.75rem 0 1.25rem; }
  .ls-slide { width: 100%; }
  .ls-inner { width: 100%; max-width: 60rem; margin: 0 auto; }
  .ls-inner.is-wide { max-width: 78rem; }
  .ls-slide .als-h2 { font-size: clamp(1.5rem, 3.4vw, 2.3rem); margin-bottom: .75rem; }
  .ls-big { font-size: clamp(1.05rem, 1.9vw, 1.3rem); line-height: 1.55; }
  [dir="rtl"] .ls-big { line-height: 1.85; }
  .ls-lead { font-size: clamp(1.02rem, 1.7vw, 1.18rem); color: var(--text-muted); max-width: 54rem; margin: 0 0 1.25rem; }
  .ls-lead strong { color: var(--text); }

  /* body: the slide's main element, with the tutor's explanation beside it on wide screens */
  .ls-body { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
  @media (min-width: 1080px) { .ls-body.has-aside { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 2rem; } }
  .ls-aside { display: grid; gap: .9rem; }
  .ls-tutor { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem 1.15rem 1.1rem; font-size: 1.02rem; line-height: 1.68; }
  [dir="rtl"] .ls-tutor { line-height: 1.95; }
  .ls-tutor .als-kicker, .ls-intuition .als-kicker { display: block; margin-bottom: .45rem; }
  .ls-intuition-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin-bottom: .35rem; }
  .ls-intuition-head .als-kicker { margin: 0; }
  .ls-intuition { font-size: 1rem; line-height: 1.65; }
  .ls-takeaway { margin-top: 1.25rem; display: grid; grid-template-columns: auto 1fr; gap: .75rem; align-items: baseline; padding: .7rem 1rem; border-radius: var(--radius-sm); background: var(--accent-soft); font-size: 1.05rem; }
  .ls-takeaway .als-kicker { white-space: nowrap; }
  .ls-detail { color: var(--text-muted); font-size: .98rem; line-height: 1.6; margin-top: .2rem; }
  .ls-prose { font-size: clamp(1.05rem, 1.6vw, 1.2rem); line-height: 1.75; max-width: 50rem; }
  [dir="rtl"] .ls-prose { line-height: 2; }
  .ls-section-n { font-family: var(--font-display); font-size: clamp(3rem, 9vw, 6rem); line-height: 1; color: var(--accent); opacity: .35; font-weight: var(--display-weight); }

  /* present view: the compact lecture look (explanations hidden) */
  [data-ls-view="present"] .ls-aside, [data-ls-view="present"] .ls-detail, [data-ls-view="present"] .ls-lead, [data-ls-view="present"] .ls-takeaway { display: none; }
  [data-ls-view="present"] .ls-body.has-aside { grid-template-columns: minmax(0, 1fr); }
  [data-ls-view="present"] .ls-inner.is-wide { max-width: 60rem; }
  [data-ls-view="present"] .ls-big { font-size: clamp(1.15rem, 2.3vw, 1.5rem); }

  /* step reveal */
  .ls-step { transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), filter .5s ease; }
  .ls-step.is-hidden { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .ls-step.is-past { opacity: .6; }
  .ls-step.is-current { opacity: 1; }
  /* a freshly inserted slide takes its starting state without animating into it (no flash of later steps) */
  .ls-init, .ls-init * { transition: none !important; }
  .ls-init .ls-svg-el { animation: none !important; }

  /* title */
  .ls-title .als-h1 { font-size: clamp(2.2rem, 6.4vw, 4.5rem); max-width: 20ch; }
  .ls-title .als-sub { font-size: clamp(1.05rem, 2.2vw, 1.35rem); margin-top: 1rem; }
  .ls-title-meta { margin-top: 2.25rem; display: flex; gap: .5rem; flex-wrap: wrap; }

  /* points / summary / objectives */
  .ls-points { list-style: none; padding: 0; margin: 0; display: grid; gap: .95rem; }
  .ls-points li { display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; align-items: start; }
  .ls-points .n { font-family: var(--font-mono); font-size: .8rem; color: var(--accent-text, var(--accent)); padding-top: .38rem; }
  .ls-summary li .n, .ls-objectives li .n { color: var(--good); }

  /* derivation steps */
  .ls-deriv { display: grid; gap: .5rem; }
  .ls-deriv-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: .2rem; padding: .65rem 1rem; border-radius: var(--radius-sm); border: 1px solid transparent; }
  .ls-deriv-row.is-current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ls-deriv-row .t { font-size: 1.02rem; }
  .ls-deriv-row .m { font-size: 1.2rem; min-width: 0; }
  .ls-deriv-row .w { color: var(--text-muted); font-size: .95rem; line-height: 1.55; }
  .ls-deriv-row .w::before { content: "\21B3\00a0"; color: var(--accent-text, var(--accent)); }
  [dir="rtl"] .ls-deriv-row .w::before { content: "\21B2\00a0"; }
  .ls-given, .ls-result { font-size: 1.08rem; }

  /* diagram */
  .ls-diagram { display: grid; gap: .9rem; }
  .ls-svg { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; justify-content: center; }
  .ls-svg svg { width: 100%; height: auto; max-height: 56vh; color: var(--text); font-family: var(--font-body); direction: ltr; overflow: visible; }
  .ls-svg [data-ls-hidden="1"] { opacity: 0; }
  .ls-svg .ls-svg-el.is-current { animation: ls-pulse 1.1s ease 1; }
  @keyframes ls-pulse { 0% { opacity: .15; } 100% { opacity: 1; } }
  .ls-caption { min-height: 3.2rem; font-size: 1.06rem; line-height: 1.6; }
  /* diagram colour classes that follow the theme */
  .ls-svg .d-line { stroke: var(--text); fill: none; }
  .ls-svg .d-muted { stroke: var(--text-faint); fill: none; }
  .ls-svg .d-accent { stroke: var(--accent); fill: none; }
  .ls-svg .d-accent2 { stroke: var(--accent-2); fill: none; }
  .ls-svg .d-good { stroke: var(--good); fill: none; }
  .ls-svg .d-bad { stroke: var(--bad); fill: none; }
  .ls-svg .d-fill { fill: var(--bg-sunken); stroke: var(--border-strong); }
  .ls-svg .d-fill-accent { fill: var(--accent-soft); stroke: var(--accent); }
  .ls-svg .d-solid-accent { fill: var(--accent); stroke: none; }
  .ls-svg .d-solid-accent2 { fill: var(--accent-2); stroke: none; }
  .ls-svg .d-solid-muted { fill: var(--text-faint); stroke: none; }
  .ls-svg .d-solid-line { fill: var(--text); stroke: none; }
  .ls-svg .d-solid-good { fill: var(--good); stroke: none; }
  .ls-svg .d-solid-bad { fill: var(--bad); stroke: none; }
  .ls-svg .d-text { fill: var(--text); stroke: none; font-size: 14px; }
  .ls-svg .d-text-muted { fill: var(--text-muted); stroke: none; font-size: 12px; }
  .ls-svg .d-text-accent { fill: var(--accent); stroke: none; font-size: 14px; font-weight: 600; }
  /* numbers inside drawings use the maths font, so they match the formulas around them */
  .ls-svg .d-num { font-family: KaTeX_Main, "Latin Modern Roman", "CMU Serif", "STIX Two Text", "Cambria Math", "Times New Roman", serif; font-size: 15px; }
  .ls-svg .d-text-muted.d-num { font-size: 13px; }
  /* labels that contain maths are typeset by KaTeX inside the drawing */
  .ls-svg foreignObject { overflow: visible; }
  .d-fo { display: flex; align-items: center; height: 24px; font-size: 14px; line-height: 1; white-space: nowrap; color: var(--text); font-family: var(--font-body); }
  .d-fo.a-middle { justify-content: center; } .d-fo.a-end { justify-content: flex-end; } .d-fo.a-start { justify-content: flex-start; }
  .d-fo.d-text-muted { color: var(--text-muted); font-size: 12px; }
  .d-fo.d-text-accent { color: var(--accent); font-weight: 600; }
  .is-mark .d-fo { color: var(--accent); }
  .d-fo .katex { font-size: 1.1em; }

  /* code */
  .ls-code { display: grid; gap: 1rem; }
  @media (min-width: 900px) { .ls-code.has-explain { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  .ls-explain { font-size: 1.05rem; line-height: 1.6; }

  /* compare */
  .ls-compare { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .ls-compare .als-card ul { margin: 0; padding-inline-start: 1.1rem; }
  .ls-compare .als-card li + li { margin-top: .4rem; }
  .ls-compare .ls-detail { margin: 0 0 .6rem; }

  /* quote */
  .ls-quote { font-family: var(--font-display); font-size: clamp(1.4rem, 3.4vw, 2.3rem); line-height: 1.32; margin: 0; max-width: 34ch; text-wrap: balance; }
  [dir="rtl"] .ls-quote { line-height: 1.7; }
  .ls-quote::before { content: "\201C"; display: block; font-size: 4rem; line-height: .6; color: var(--accent); margin-bottom: .5rem; }
  .ls-quote-by { margin-top: 1.1rem; color: var(--text-muted); font-size: 1.02rem; }

  /* check */
  .ls-options { display: grid; gap: .6rem; margin-top: 1rem; }
  .ls-option { text-align: start; justify-content: flex-start; align-items: baseline; min-height: 3rem; font-size: 1.02rem; padding: .6rem 1rem; gap: .75rem; }
  .ls-option-text { flex: 1 1 auto; min-width: 0; }
  .ls-option.is-right { background: var(--good-soft); border-color: var(--good); }
  .ls-option.is-wrong { background: var(--bad-soft); border-color: var(--bad); }

  /* timeline */
  .ls-timeline { position: relative; display: grid; gap: 1rem; padding-inline-start: 1.75rem; }
  .ls-timeline::before { content: ""; position: absolute; inset-inline-start: .45rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--border-strong); }
  .ls-event { position: relative; }
  .ls-event::before { content: ""; position: absolute; inset-inline-start: -1.62rem; top: .45rem; width: .8rem; height: .8rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .ls-event.is-current::before { background: var(--accent); }
  .ls-event .when { font-family: var(--font-mono); font-size: .8rem; color: var(--accent-text, var(--accent)); }

  /* definition */
  .ls-term { font-family: var(--font-display); font-size: clamp(1.8rem, 5vw, 3.1rem); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.08; margin: .25rem 0 .9rem; }
  [dir="rtl"] .ls-term { line-height: 1.5; }
  .ls-def { font-size: clamp(1.08rem, 2.1vw, 1.4rem); max-width: 44rem; }
  .ls-example { margin-top: 1.25rem; }

  /* controls */
  .ls-bottom { background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
  .ls-bottom .als-shell { display: flex; align-items: center; gap: .35rem; min-height: 3.1rem; max-width: none; }
  .ls-count { font-family: var(--font-mono); font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; direction: ltr; padding: 0 .35rem; }
  .ls-notes, .ls-more { max-width: 60rem; margin: 0 auto 1rem; }
  .ls-overview { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); padding: 1.5rem 0 3rem; width: 100%; align-self: start; }
  .ls-thumb { text-align: start; cursor: pointer; min-height: 7rem; display: flex; flex-direction: column; gap: .35rem; }
  .ls-thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ls-thumb .n { font-family: var(--font-mono); font-size: .7rem; color: var(--text-faint); }
  .ls-thumb .t { font-weight: 600; font-family: var(--font-display); }
  .ls-anim-in { animation: ls-in .45s cubic-bezier(.2,.7,.2,1) both; }
  .ls-anim-back { animation: ls-back .45s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes ls-in { from { opacity: 0; transform: translateX(calc(28px * var(--als-dir))); } to { opacity: 1; transform: none; } }
  @keyframes ls-back { from { opacity: 0; transform: translateX(calc(-28px * var(--als-dir))); } to { opacity: 1; transform: none; } }

  /* diagram engine: emphasis, focus, line drawing */
  .ls-svg .d-halo { paint-order: stroke; stroke: var(--bg-elev); stroke-width: 4px; stroke-linejoin: round; }
  .ls-svg .ls-svg-el, .ls-svg .ls-svg-el * { transition: opacity .55s ease, fill .35s ease, stroke .35s ease; }
  .ls-svg.has-focus .ls-svg-el.is-past { opacity: .38; }
  .ls-svg .is-mark.d-fill, .ls-svg .is-mark .d-fill, .ls-svg .is-mark.d-fill-accent, .ls-svg .is-mark .d-fill-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
  .ls-svg .is-mark.d-text, .ls-svg .is-mark .d-text, .ls-svg .is-mark.d-text-muted, .ls-svg .is-mark .d-text-muted { fill: var(--accent); font-weight: 700; }
  .ls-svg .is-mark.d-line, .ls-svg .is-mark .d-line, .ls-svg .is-mark.d-muted, .ls-svg .is-mark .d-muted { stroke: var(--accent); }
  .ls-svg .is-current .ls-drawable, .ls-svg .ls-drawable.is-current { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); animation: ls-draw .9s ease forwards; }
  @keyframes ls-draw { to { stroke-dashoffset: 0; } }

  /* formula with named parts */
  .ls-formula { font-size: clamp(1.25rem, 2.9vw, 2rem); padding: 1.1rem 1rem; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ls-parts { display: grid; gap: .5rem; margin-top: 1.1rem; }
  .ls-part { display: grid; grid-template-columns: minmax(4.5rem, max-content) 1fr; gap: 1rem; align-items: baseline; padding: .45rem .8rem; border-radius: var(--radius-sm); border: 1px solid transparent; }
  .ls-part.is-current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ls-part .sym { font-size: 1.2rem; color: var(--accent-text, var(--accent)); }
  .ls-part .means { font-size: 1.06rem; }
  .ls-formula-note { margin-top: 1rem; }

  /* table */
  .ls-table { width: 100%; border-collapse: collapse; font-size: clamp(.98rem, 1.6vw, 1.15rem); }
  .ls-table th { text-align: start; font-family: var(--font-mono); font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-strong); padding: .5rem .75rem; }
  .ls-table td { padding: .6rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; transition: background .35s ease; }
  .ls-table tr.is-current td { background: var(--accent-soft); }
  .ls-table-wrap { overflow-x: auto; overflow-y: hidden; }

  /* pitfall, recall */
  .ls-pitfall { display: grid; gap: .8rem; }
  .ls-hint { margin-top: .75rem; font-size: .95rem; }

  /* figure from the source with spotlight marks (image coordinates stay physical) */
  .ls-fig { display: flex; justify-content: center; }
  .ls-fig-frame { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); max-width: 100%; direction: ltr; }
  .ls-fig-frame img { display: block; max-width: 100%; max-height: 56vh; height: auto; }
  .ls-fig-mark { position: absolute; border: 2px solid var(--accent); border-radius: 6px; transition: opacity .4s ease, box-shadow .5s ease; }
  .ls-fig-mark .n { position: absolute; top: 2px; left: 2px; min-width: 1.35rem; padding: 0 .3rem; border-radius: 999px; background: var(--accent); color: var(--accent-contrast); font-family: var(--font-mono); font-size: .72rem; line-height: 1.35rem; text-align: center; }
  .ls-fig-mark.is-off { opacity: 0; }
  .ls-fig-mark.is-past { opacity: .5; }
  .ls-fig-mark.is-current { box-shadow: 0 0 0 200vmax color-mix(in srgb, var(--bg) 62%, transparent); }

  .ls-bottom [hidden], .ls-more[hidden], .ls-notes[hidden] { display: none !important; }
  .ls-level { font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-text, var(--accent)); }
  .ls-textbtn { font-family: var(--font-mono); font-size: .74rem; white-space: nowrap; }
  @media (max-width: 640px) { .ls-textbtn .lbl { display: none; } }

  @media print {
    .ls-progress, .ls-overview, .ls-side { display: none !important; }
    .ls-work { display: block; }
    .ls-stage { min-height: 0; display: block; padding: 0; }
    .ls-print-slide { break-after: page; padding: 6mm 0; }
    .ls-step.is-hidden, .ls-step.is-past { opacity: 1 !important; transform: none !important; }
    .ls-svg [data-ls-hidden="1"] { opacity: 1 !important; }
    .ls-fig-mark { opacity: 1 !important; box-shadow: none !important; }
    .ls-body.has-aside { grid-template-columns: minmax(0, 1fr) !important; }
    .ls-aside, .ls-detail, .ls-lead, .ls-takeaway { display: revert !important; }
    .ls-aside { display: grid !important; }
  }
</style>
</head>

<div id="app"></div>
<!--ALS:DATA-->
<script>/*ALS:CORE*/</script>
<script>/*ALS:VIZ*/</script>
<script>
ALS.boot(function (lesson) {
  var E = ALS.el, $ = ALS.$, $$ = ALS.$$, V = ALS.viz, T = ALS.t;
  var app = $('#app');
  var all = lesson.slides;
  var FWD = ALS.rtl ? '←' : '→';

  /* ---------- depth: untagged content is core; "medium" and "deep" tags mark optional material ("standard" = older name for medium) ---------- */
  var RANK = { core: 0, medium: 1, standard: 1, deep: 2 }, DEPTH = { brief: 0, medium: 1, standard: 1, deep: 2 };
  function depthName(d) { return d === 'standard' ? 'medium' : d; }
  function lvl(x) { var r = RANK[x && x.level]; return r == null ? 0 : r; }
  function countAt(d) {
    var n = 0;
    all.forEach(function (s) { if (lvl(s) > d) return; n++; if (s.layout === 'steps') s.steps.forEach(function (r) { if (lvl(r) <= d) n++; }); });
    return n;
  }
  var depths = ['brief', 'medium', 'deep'];
  if (countAt(0) === countAt(1)) depths.splice(depths.indexOf('brief'), 1);
  if (countAt(1) === countAt(2)) depths.splice(depths.indexOf('deep'), 1);
  var startDepth = depthName(ALS.store.get('depth', null) || lesson.depth || 'medium');
  if (depths.indexOf(startDepth) < 0) startDepth = 'medium';

  var st = {
    i: 0, step: 0, notes: ALS.store.get('notes', false), more: ALS.store.get('more', false), depth: startDepth,
    view: ALS.store.get('view', lesson.view === 'present' ? 'present' : 'study'), all: ALS.store.get('all', false),
    overview: false, playing: false, timer: null, dir: 1, seen: {}
  };
  document.documentElement.setAttribute('data-ls-view', st.view);
  var slides = [];

      { k: T('View'), v: T(st.view) },
      { k: T('Left'), v: '~' + Math.max(0, Math.round(left / 60)) + ' ' + T('min'), title: T('Estimated reading time for the rest of the lesson') },
      { v: Math.round(done / total * 100) + '%', title: T('Progress') }
    ]);
  }

  function go(i, step, dir) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    var changed = i !== st.i || !$('#ls-current');
    st.i = i; st.dir = dir || 1;
    st.step = st.all ? stepCount(slides[i]) - 1 : (step == null ? 0 : step);
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* file:// in some browsers */ }
    if (changed || st.overview) { st.overview = false; renderStage(true); } else applySteps();
    ALS.store.set('pos', i);
    if (window.innerWidth <= 900 && !ALS.panelHidden('sidebar')) ALS.togglePanel('sidebar', false);
  }
  function next() {
    var s = slides[st.i];
    if (st.overview) return toggleOverview();
    if (st.step < stepCount(s) - 1) { st.step++; applySteps(); }
    else if (st.i < slides.length - 1) go(st.i + 1, 0, 1);
    else stopPlay();
  }
  function prev() {
    if (st.overview) return toggleOverview();
    if (st.step > 0 && !st.all) { st.step--; applySteps(); }
    else if (st.i > 0) go(st.i - 1, stepCount(slides[st.i - 1]) - 1, -1);
  }
  function stopPlay() { st.playing = false; clearInterval(st.timer); var b = $('#ls-play'); if (b) b.innerHTML = ALS.icon('play'); }
  function togglePlay() {
    if (st.playing) return stopPlay();
    st.playing = true; $('#ls-play').innerHTML = ALS.icon('pause');
    st.timer = setInterval(next, (lesson.autoplaySec || 4) * 1000);
  }

  /* ---------- rendering ---------- */
  function renderStage(animate) {
    var stage = $('#ls-stage');
    stage.innerHTML = '';
    var notes = $('#ls-notes'), more = $('#ls-more'), moreBtn = $('#ls-more-btn');
    if (st.overview) {
      if (notes) notes.hidden = true;
      if (more) more.hidden = true;
      var grid = E('div', { class: 'ls-overview' });
      slides.forEach(function (s, k) {
        grid.appendChild(E('button', { type: 'button', class: 'als-card ls-thumb', 'aria-current': String(k === st.i), onclick: function () { st.overview = false; go(k, 0, 1); } }, [
          E('span', { class: 'n', text: String(k + 1).padStart(2, '0') + ' · ' + s.layout }),
          E('span', { class: 't', html: ALS.md(slideTitle(s), { inline: true }) }),
          s.level && s.level !== 'core' ? E('span', { class: 'ls-level', text: T(depthName(s.level)) }) : null
        ]));
      });
      stage.appendChild(grid);
      ALS.renderMath(grid);
      return;
    }
    var cur = slides[st.i];
    var node = slideNode(cur, st.i);
    node.id = 'ls-current';
    node.classList.add('ls-init');
    if (animate) node.classList.add(st.dir < 0 ? 'ls-anim-back' : 'ls-anim-in');
    stage.appendChild(node);
    if (notes) {
      notes.hidden = !(st.notes && cur.notes);
      if (cur.notes) ALS.rich(notes, '**' + T('Notes') + '.** ' + cur.notes);
    }
    if (more) {
      more.hidden = !(st.more && cur.more);
      if (cur.more) ALS.rich(more, '**' + T('More detail') + '.** ' + cur.more);
    }
    if (moreBtn) { moreBtn.hidden = !cur.more; moreBtn.setAttribute('aria-pressed', String(!!st.more)); }
    applySteps();
    void node.offsetWidth; // commit the starting state before transitions are allowed again
    setTimeout(function () { node.classList.remove('ls-init'); }, 90); // not requestAnimationFrame: it never fires in a background tab
  }

  function renderOutline() {
    var ol = $('#ls-out'); if (!ol) return;
    ol.innerHTML = '';
    slides.forEach(function (s, k) {
      var li = E('li', { 'data-k': String(k), class: s.layout === 'section' || s.layout === 'title' ? 'is-section' : '' }, [
        E('button', { type: 'button', onclick: function () { go(k, 0, k >= st.i ? 1 : -1); } }, [
          E('span', { class: 'n', text: String(k + 1).padStart(2, '0') }),
          E('span', { class: 'als-rich', html: ALS.md(slideTitle(s), { inline: true }) })
        ])
      ]);
      ol.appendChild(li);
    });
    ALS.renderMath(ol);
  }

  function depthLabel() { return T('Depth') + ': ' + T(st.depth); }
  function setDepth(d) {
    var cur = slides[st.i], at = all.indexOf(cur);
    st.depth = d; ALS.store.set('depth', d); refilter();
    var k = slides.indexOf(cur);
    if (k < 0) { k = 0; slides.forEach(function (s, j) { if (all.indexOf(s) <= at) k = j; }); }
    st.i = k; st.step = st.all ? stepCount(slides[k]) - 1 : 0; st.overview = false;
    var b = $('#ls-depth .lbl'); if (b) b.textContent = depthLabel();
    renderOutline();
    renderStage(true);
    ALS.toast(depthLabel() + ' · ' + T('{0} slides', slides.length));
  }
  function cycleDepth() {
    if (depths.length < 2) return ALS.toast(T('This lesson has one depth'));
    setDepth(depths[(depths.indexOf(st.depth) + 1) % depths.length]);
  }
  function toggleView() {
    st.view = st.view === 'study' ? 'present' : 'study';
    ALS.store.set('view', st.view);
    document.documentElement.setAttribute('data-ls-view', st.view);
    var b = $('#ls-view'); if (b) { b.setAttribute('aria-pressed', String(st.view === 'study')); $('.lbl', b).textContent = viewLabel(); }
    ALS.toast(st.view === 'study' ? T('Study view: explanations on the page') : T('Present view: compact slides'));
    paintChrome(); ALS.fitMath(document);
  }
  function viewLabel() { return st.view === 'study' ? T('Study view') : T('Present view'); }
  function toggleAll() {
    st.all = !st.all; ALS.store.set('all', st.all);
    var b = $('#ls-all'); if (b) b.setAttribute('aria-pressed', String(st.all));
    st.step = st.all ? stepCount(slides[st.i]) - 1 : 0;
    renderStage(false);
    ALS.toast(st.all ? T('Everything on a slide is shown at once') : T('Slides build up step by step'));
  }

  function textBtn(id, icon, label, title, fn, pressed) {
    var b = E('button', { type: 'button', id: id, class: 'als-btn als-btn--ghost als-btn--sm ls-textbtn', title: title, 'aria-pressed': pressed == null ? null : String(pressed), onclick: fn }, [
      E('span', { html: ALS.icon(icon), style: 'display:inline-grid' }), E('span', { class: 'lbl', text: label })
    ]);
    b.querySelector('svg').style.cssText = 'width:1rem;height:1rem';
    return b;
  }

  function render() {
    app.innerHTML = '';
    app.appendChild(E('div', { class: 'ls-progress als-noprint' }, [E('span')]));
    app.appendChild(ALS.topbar([
      ALS.iconBtn('print', T('Print or save as PDF (everything revealed)'), printAll, 'als-noprint')
    ]));
    var side = ALS.panel('sidebar', E('aside', { class: 'ls-side als-noprint', 'aria-label': T('Outline') }, [E('div', { class: 'ls-side-in' }, [
      E('div', { class: 'ls-side-head' }, [E('span', { class: 'als-kicker', text: T('Outline') }),
        ALS.iconBtn('x', T('Hide: {0}', T('Outline')), function () { ALS.togglePanel('sidebar', false); }, 'als-btn--sm')]),
      E('ol', { class: 'ls-out', id: 'ls-out' })
    ])]), T('Outline'));
    var main = E('div', { class: 'ls-main' }, [
      E('div', { class: 'als-shell', style: 'display:flex;flex:1 0 auto' }, [E('div', { id: 'ls-stage', class: 'ls-stage', style: 'width:100%' })]),
      E('div', { class: 'als-shell' }, [
        E('div', { id: 'ls-more', class: 'ls-more als-callout als-callout--info als-rich', hidden: true }),
        E('div', { id: 'ls-notes', class: 'ls-notes als-callout als-rich', hidden: true })
      ])
    ]);
    app.appendChild(E('div', { class: 'ls-work als-main' }, [side, main]));
    var prevBtn = ALS.iconBtn('left', T('Previous'), prev, 'als-flip'), nextBtn = ALS.iconBtn('right', T('Next (Space)'), next, 'als-flip');
    var bottom = ALS.panel('controls', E('nav', { class: 'ls-bottom', 'aria-label': T('Lesson controls') }, [E('div', { class: 'als-shell' }, [
      prevBtn, nextBtn,
      E('span', { class: 'ls-count' }),
      E('div', { class: 'als-spacer' }),
      textBtn('ls-view', 'book', viewLabel(), T('Switch between study view (with explanations) and present view (V)'), toggleView, st.view === 'study'),
      textBtn('ls-all', 'layers', T('All at once'), T('Show everything on a slide at once, or build it up step by step (A)'), toggleAll, st.all),
      depths.length > 1 ? textBtn('ls-depth', 'eye', depthLabel(), T('Change depth (D)'), cycleDepth) : null,
      (function () { var b = ALS.iconBtn('bulb', T('More detail on this slide (E)'), toggleMore); b.id = 'ls-more-btn'; b.hidden = true; return b; })(),
      (function () { var b = ALS.iconBtn('play', T('Autoplay (P)'), togglePlay); b.id = 'ls-play'; return b; })(),
      ALS.iconBtn('notes', T('Notes (N)'), toggleNotes),
      ALS.iconBtn('grid', T('Overview (O)'), toggleOverview),
      ALS.iconBtn('expand', T('Full screen (F)'), fullscreen),
      ALS.iconBtn('down', T('Hide: {0}', T('Controls')), function () { ALS.togglePanel('controls', false); }, 'als-panel-close')
    ])]));
    app.appendChild(ALS.dock([bottom]));
    renderOutline();
    renderStage(false);
  }

  function toggleNotes() { st.notes = !st.notes; ALS.store.set('notes', st.notes); var keep = st.step; renderStage(false); st.step = keep; applySteps(); if (st.notes && !slides[st.i].notes) ALS.toast(T('No notes on this slide')); }
  function toggleMore() { st.more = !st.more; ALS.store.set('more', st.more); var keep = st.step; renderStage(false); st.step = keep; applySteps(); if (st.more && !slides[st.i].more) ALS.toast(T('No extra detail on this slide')); }
  function toggleOverview() { st.overview = !st.overview; renderStage(true); }
  function fullscreen() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    catch (e) { ALS.toast(T('Full screen is not available here')); }
  }
  function printAll() {
    var stage = $('#ls-stage');
    var withMore = st.more || new URLSearchParams(location.search).get('more') === '1';
    var keepAll = st.all; st.all = true;
    stage.innerHTML = '';
    slides.forEach(function (s, k) {
      var n = slideNode(s, k, true);
      stage.appendChild(n);
      var cap = $('.ls-caption', n);
      if (cap && isDiagram(s)) ALS.rich(cap, (s.captions || [s.caption || '']).join(' '));
      if (cap && s.layout === 'figure') {
        ALS.rich(cap, [s.caption || ''].concat((s.marks || []).map(function (m, j) { return '**' + (m.label || j + 1) + '.** ' + (m.text || ''); })).join('\n\n'));
      }
      if (s.layout === 'code' && codeExplain(s).length) { var ex = $('.ls-explain', n); if (ex) ALS.rich(ex, codeExplain(s).join('\n\n')); }
      if (withMore && s.more) $('.ls-inner', n).appendChild(rich('div', '**' + T('More detail') + '.** ' + s.more, 'als-callout als-callout--info ls-more'));
    });
    st.all = keepAll;
    ALS.renderMath(stage);
    if (new URLSearchParams(location.search).get('print') === '1') return; // headless PDF: leave everything revealed
    setTimeout(function () { window.print(); renderStage(false); }, 250);
  }

  var keys = {
    ' ': next, 'PageDown': next, 'Enter': next, 'PageUp': prev, 'Backspace': prev,
    'Home': function () { go(0, 0, -1); }, 'End': function () { go(slides.length - 1, 0, 1); },
    'n': toggleNotes, 'N': toggleNotes, 'o': toggleOverview, 'O': toggleOverview,
    'f': fullscreen, 'F': fullscreen, 'p': togglePlay, 'P': togglePlay,
    'd': cycleDepth, 'D': cycleDepth, 'e': toggleMore, 'E': toggleMore,
    'v': toggleView, 'V': toggleView, 'a': toggleAll, 'A': toggleAll,
    't': function () { ALS.togglePanel('sidebar'); }, 'T': function () { ALS.togglePanel('sidebar'); },
    'Escape': function () { if (st.overview) toggleOverview(); }
  };
  keys.ArrowRight = ALS.rtl ? prev : next; // arrows follow the reading direction
  keys.ArrowLeft = ALS.rtl ? next : prev;
  ALS.onKey(keys);

  // touch swipe
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = (e.changedTouches[0].clientX - tx) * (ALS.rtl ? -1 : 1); tx = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });

  window.addEventListener('hashchange', function () {
    var h = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(h) && h - 1 !== st.i) go(h - 1, 0, h - 1 > st.i ? 1 : -1);
  });
  document.addEventListener('als:panels', function () { if ($('#ls-current')) paintChrome(); });
  document.addEventListener('als:math', function () { renderOutline(); paintChrome(); });

  var params = new URLSearchParams(location.search);
  var askedDepth = depthName(params.get('depth'));
  if (depths.indexOf(askedDepth) > -1) { st.depth = askedDepth; refilter(); }
  if (params.get('view') === 'present' || params.get('view') === 'study') { st.view = params.get('view'); document.documentElement.setAttribute('data-ls-view', st.view); }
  var start = parseInt((location.hash || '').slice(1), 10);
  st.i = isNaN(start) ? 0 : Math.max(0, Math.min(slides.length - 1, start - 1));
  if (st.all) st.step = stepCount(slides[st.i]) - 1;
  render();
  if (params.get('print') === '1') printAll();
});
</script>
</body>
</html>
