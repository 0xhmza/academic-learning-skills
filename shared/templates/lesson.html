<!doctype html>
<html lang="{{lang}}" data-als-theme="{{theme}}" data-als-default="{{theme}}" data-als-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="generator" content="academic-learning-skills {{version}} · lesson">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>/*ALS:EARLY*/</script>
<style>/*ALS:CSS*/</style>
<style>
  html, body { overflow-x: clip; } /* slide-in animation must never cause a horizontal scrollbar */
  .ls-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 40; background: transparent; }
  .ls-progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
  .ls-stage { min-height: calc(100vh - 3.5rem - 4rem); display: flex; align-items: center; justify-content: center; padding: 2rem 0 1rem; }
  .ls-slide { width: 100%; }
  .ls-inner { width: 100%; max-width: 60rem; margin: 0 auto; }
  .ls-slide .als-h2 { font-size: clamp(1.6rem, 4vw, 2.6rem); margin-bottom: 1.25rem; }
  .ls-big { font-size: clamp(1.1rem, 2.2vw, 1.45rem); line-height: 1.55; }

  /* step reveal */
  .ls-step { transition: opacity .5s ease, transform .5s cubic-bezier(.2,.7,.2,1), filter .5s ease; }
  .ls-step.is-hidden { opacity: 0; transform: translateY(14px); pointer-events: none; }
  .ls-step.is-past { opacity: .55; }
  .ls-step.is-current { opacity: 1; }

  /* title */
  .ls-title { text-align: left; }
  .ls-title .als-h1 { font-size: clamp(2.3rem, 7vw, 4.75rem); max-width: 18ch; }
  .ls-title .als-sub { font-size: clamp(1.05rem, 2.2vw, 1.35rem); margin-top: 1rem; }
  .ls-title-meta { margin-top: 2.5rem; display: flex; gap: .5rem; flex-wrap: wrap; }

  /* points / summary */
  .ls-points { list-style: none; padding: 0; margin: 0; display: grid; gap: .9rem; }
  .ls-points li { display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; align-items: start; }
  .ls-points .n { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); padding-top: .35rem; }
  .ls-summary li .n { color: var(--good); }

  /* derivation steps */
  .ls-deriv { display: grid; gap: .5rem; }
  .ls-deriv-row { display: grid; grid-template-columns: minmax(0, 1fr); gap: .25rem; padding: .7rem 1rem; border-radius: var(--radius-sm); border: 1px solid transparent; }
  .ls-deriv-row.is-current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ls-deriv-row .t { color: var(--text-muted); font-size: .98rem; }
  .ls-deriv-row .m { font-size: 1.2rem; overflow-x: auto; }

  /* diagram */
  .ls-diagram { display: grid; gap: 1rem; }
  .ls-svg { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); padding: 1rem; display: flex; justify-content: center; }
  .ls-svg svg { width: 100%; height: auto; max-height: 58vh; color: var(--text); font-family: var(--font-body); }
  .ls-svg [data-ls-hidden="1"] { opacity: 0; }
  .ls-svg .ls-svg-el { transition: opacity .55s ease; }
  .ls-svg .ls-svg-el.is-current { animation: ls-pulse 1.2s ease 1; }
  @keyframes ls-pulse { 0% { opacity: .2; } 100% { opacity: 1; } }
  .ls-caption { min-height: 3.2rem; font-size: 1.05rem; }
  /* diagram colour classes that follow the theme */
  .ls-svg .d-line { stroke: var(--text); fill: none; }
  .ls-svg .d-muted { stroke: var(--text-faint); fill: none; }
  .ls-svg .d-accent { stroke: var(--accent); fill: none; }
  .ls-svg .d-accent2 { stroke: var(--accent-2); fill: none; }
  .ls-svg .d-good { stroke: var(--good); fill: none; }
  .ls-svg .d-bad { stroke: var(--bad); fill: none; }
  .ls-svg .d-fill { fill: var(--bg-sunken); stroke: var(--border-strong); }
  .ls-svg .d-fill-accent { fill: var(--accent-soft); stroke: var(--accent); }
  .ls-svg .d-solid-accent { fill: var(--accent); stroke: none; }
  .ls-svg .d-solid-accent2 { fill: var(--accent-2); stroke: none; }
  .ls-svg .d-solid-muted { fill: var(--text-faint); stroke: none; }
  .ls-svg .d-solid-line { fill: var(--text); stroke: none; }
  .ls-svg .d-solid-good { fill: var(--good); stroke: none; }
  .ls-svg .d-solid-bad { fill: var(--bad); stroke: none; }
  .ls-svg .d-text { fill: var(--text); stroke: none; font-size: 14px; }
  .ls-svg .d-text-muted { fill: var(--text-muted); stroke: none; font-size: 12px; }
  .ls-svg .d-text-accent { fill: var(--accent); stroke: none; font-size: 14px; font-weight: 600; }

  /* code */
  .ls-code { display: grid; gap: 1rem; }
  @media (min-width: 900px) { .ls-code.has-explain { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); align-items: start; } }
  .ls-explain { font-size: 1.05rem; }

  /* compare */
  .ls-compare { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
  .ls-compare .als-card ul { margin: 0; padding-left: 1.1rem; }
  .ls-compare .als-card li + li { margin-top: .4rem; }

  /* quote */
  .ls-quote { font-family: var(--font-display); font-size: clamp(1.5rem, 4vw, 2.6rem); line-height: 1.3; margin: 0; max-width: 32ch; text-wrap: balance; }
  .ls-quote::before { content: "\201C"; display: block; font-size: 4rem; line-height: .6; color: var(--accent); margin-bottom: .5rem; }
  .ls-quote-by { margin-top: 1.25rem; color: var(--text-muted); font-size: 1.05rem; }

  /* check */
  .ls-options { display: grid; gap: .6rem; margin-top: 1rem; }
  .ls-option { text-align: left; justify-content: flex-start; min-height: 3rem; font-size: 1.02rem; padding: .6rem 1rem; }
  .ls-option.is-right { background: var(--good-soft); border-color: var(--good); }
  .ls-option.is-wrong { background: var(--bad-soft); border-color: var(--bad); }

  /* timeline */
  .ls-timeline { position: relative; display: grid; gap: 1rem; padding-left: 1.75rem; }
  .ls-timeline::before { content: ""; position: absolute; left: .45rem; top: .4rem; bottom: .4rem; width: 2px; background: var(--border-strong); }
  .ls-event { position: relative; }
  .ls-event::before { content: ""; position: absolute; left: -1.62rem; top: .45rem; width: .8rem; height: .8rem; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
  .ls-event.is-current::before { background: var(--accent); }
  .ls-event .when { font-family: var(--font-mono); font-size: .8rem; color: var(--accent); }

  /* definition */
  .ls-term { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 3.5rem); font-weight: var(--display-weight); letter-spacing: var(--display-tracking); line-height: 1.05; margin: .25rem 0 1rem; }
  .ls-def { font-size: clamp(1.1rem, 2.4vw, 1.5rem); max-width: 42rem; }
  .ls-example { margin-top: 1.5rem; }

  /* chrome */
  .ls-bottom { position: sticky; bottom: 0; z-index: 15; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
  .ls-bottom .als-shell { display: flex; align-items: center; gap: .5rem; min-height: 3.5rem; }
  .ls-count { font-family: var(--font-mono); font-size: .8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .ls-notes { max-width: 60rem; margin: 0 auto 1rem; }
  .ls-overview { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 14rem), 1fr)); padding: 2rem 0 4rem; }
  .ls-thumb { text-align: left; cursor: pointer; min-height: 7rem; display: flex; flex-direction: column; gap: .35rem; }
  .ls-thumb[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .ls-thumb .n { font-family: var(--font-mono); font-size: .7rem; color: var(--text-faint); }
  .ls-thumb .t { font-weight: 600; font-family: var(--font-display); }
  .ls-anim-in { animation: ls-in .5s cubic-bezier(.2,.7,.2,1) both; }
  .ls-anim-back { animation: ls-back .5s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes ls-in { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
  @keyframes ls-back { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }

  /* diagram engine: emphasis, focus, line drawing */
  .ls-svg .d-halo { paint-order: stroke; stroke: var(--bg-elev); stroke-width: 4px; stroke-linejoin: round; }
  .ls-svg .ls-svg-el, .ls-svg .ls-svg-el * { transition: opacity .55s ease, fill .35s ease, stroke .35s ease; }
  .ls-svg.has-focus .ls-svg-el.is-past { opacity: .38; }
  .ls-svg .is-mark.d-fill, .ls-svg .is-mark .d-fill, .ls-svg .is-mark.d-fill-accent, .ls-svg .is-mark .d-fill-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.4; }
  .ls-svg .is-mark.d-text, .ls-svg .is-mark .d-text, .ls-svg .is-mark.d-text-muted, .ls-svg .is-mark .d-text-muted { fill: var(--accent); font-weight: 700; }
  .ls-svg .is-mark.d-line, .ls-svg .is-mark .d-line, .ls-svg .is-mark.d-muted, .ls-svg .is-mark .d-muted { stroke: var(--accent); }
  .ls-svg .is-current .ls-drawable, .ls-svg .ls-drawable.is-current { stroke-dasharray: var(--len, 2000); stroke-dashoffset: var(--len, 2000); animation: ls-draw .9s ease forwards; }
  @keyframes ls-draw { to { stroke-dashoffset: 0; } }

  /* formula with named parts */
  .ls-formula { font-size: clamp(1.3rem, 3.2vw, 2.1rem); padding: 1.1rem 1rem; background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
  .ls-parts { display: grid; gap: .55rem; margin-top: 1.1rem; }
  .ls-part { display: grid; grid-template-columns: minmax(4.5rem, max-content) 1fr; gap: 1rem; align-items: baseline; padding: .45rem .8rem; border-radius: var(--radius-sm); border: 1px solid transparent; }
  .ls-part.is-current { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
  .ls-part .sym { font-size: 1.2rem; color: var(--accent); }
  .ls-part .means { font-size: 1.08rem; }
  .ls-formula-note { margin-top: 1rem; }

  /* worked example frame around a derivation */
  .ls-deriv-row .w { color: var(--text-faint); font-size: .88rem; font-style: italic; }
  .ls-given, .ls-result { font-size: 1.08rem; }

  /* table */
  .ls-table { width: 100%; border-collapse: collapse; font-size: clamp(1rem, 1.8vw, 1.2rem); }
  .ls-table th { text-align: left; font-family: var(--font-mono); font-size: .76rem; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid var(--border-strong); padding: .5rem .75rem; }
  .ls-table td { padding: .6rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; transition: background .35s ease; }
  .ls-table tr.is-current td { background: var(--accent-soft); }
  .ls-table-wrap { overflow-x: auto; }

  /* pitfall, recall */
  .ls-pitfall { display: grid; gap: .8rem; }
  .ls-hint { margin-top: .75rem; font-size: .95rem; }

  /* figure from the source with spotlight marks */
  .ls-fig { display: flex; justify-content: center; }
  .ls-fig-frame { position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-elev); max-width: 100%; }
  .ls-fig-frame img { display: block; max-width: 100%; max-height: 58vh; height: auto; }
  .ls-fig-mark { position: absolute; border: 2px solid var(--accent); border-radius: 6px; transition: opacity .4s ease, box-shadow .5s ease; }
  .ls-fig-mark .n { position: absolute; top: 2px; left: 2px; min-width: 1.35rem; padding: 0 .3rem; border-radius: 999px; background: var(--accent); color: var(--accent-contrast); font-family: var(--font-mono); font-size: .72rem; line-height: 1.35rem; text-align: center; }
  .ls-fig-mark.is-off { opacity: 0; }
  .ls-fig-mark.is-past { opacity: .5; }
  .ls-fig-mark.is-current { box-shadow: 0 0 0 200vmax color-mix(in srgb, var(--bg) 62%, transparent); }

  /* optional deeper explanation */
  .ls-more { max-width: 60rem; margin: 0 auto 1rem; }
  .ls-bottom [hidden], .ls-more[hidden], .ls-notes[hidden] { display: none !important; }
  .ls-level { font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  #ls-depth { font-family: var(--font-mono); font-size: .76rem; white-space: nowrap; }

  @media print {
    .ls-progress, .ls-bottom, .ls-overview { display: none !important; }
    .ls-stage { min-height: 0; display: block; padding: 0; }
    .ls-print-slide { break-after: page; padding: 8mm 0; }
    .ls-step.is-hidden, .ls-step.is-past { opacity: 1 !important; transform: none !important; }
    .ls-svg [data-ls-hidden="1"] { opacity: 1 !important; }
    .ls-fig-mark { opacity: 1 !important; box-shadow: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<!--ALS:DATA-->
<script>/*ALS:CORE*/</script>
<script>/*ALS:VIZ*/</script>
<script>
ALS.boot(function (lesson) {
  var E = ALS.el, $ = ALS.$, $$ = ALS.$$, V = ALS.viz;
  var app = $('#app');
  var all = lesson.slides;

  /* ---------- labels (English, German) ---------- */
  var TEXT = {
    en: { check: 'Quick check', answer: 'Answer', example: 'Example', notes: 'Notes', given: 'Given', result: 'Result', mistake: 'Common mistake', why: 'Why it fails', correct: 'Correct',
      recall: 'Recall', recallHint: 'Answer in your head or aloud, then press →', more: 'More detail', slides: 'slides', begin: 'Press <span class="als-kbd">→</span> to begin',
      strict: 'From your material only', depth: 'Depth', brief: 'brief', medium: 'medium', standard: 'medium', deep: 'deep', oneDepth: 'This lesson has one depth', noNotes: 'No notes on this slide',
      noMore: 'No extra detail on this slide', definition: 'Definition', badSvg: 'Diagram could not be displayed.' },
    de: { check: 'Kurze Frage', answer: 'Antwort', example: 'Beispiel', notes: 'Notizen', given: 'Gegeben', result: 'Ergebnis', mistake: 'Häufiger Fehler', why: 'Warum das nicht stimmt', correct: 'Richtig',
      recall: 'Abruf', recallHint: 'Erst selbst beantworten, dann → drücken', more: 'Mehr Details', slides: 'Folien', begin: 'Mit <span class="als-kbd">→</span> starten',
      strict: 'Nur aus deinen Unterlagen', depth: 'Tiefe', brief: 'kurz', medium: 'mittel', standard: 'mittel', deep: 'tief', oneDepth: 'Diese Lektion hat nur eine Tiefe', noNotes: 'Keine Notizen auf dieser Folie',
      noMore: 'Keine Zusatzdetails auf dieser Folie', definition: 'Definition', badSvg: 'Diagramm konnte nicht angezeigt werden.' }
  };
  var L = TEXT[String(lesson.lang || 'en').slice(0, 2).toLowerCase()] || TEXT.en;

  /* ---------- depth: untagged content is core; "medium" and "deep" tags mark optional material ("standard" = older name for medium) ---------- */
  var RANK = { core: 0, medium: 1, standard: 1, deep: 2 }, DEPTH = { brief: 0, medium: 1, standard: 1, deep: 2 };
  function depthName(d) { return d === 'standard' ? 'medium' : d; }
  function lvl(x) { var r = RANK[x && x.level]; return r == null ? 0 : r; }
  function countAt(d) {
    var n = 0;
    all.forEach(function (s) { if (lvl(s) > d) return; n++; if (s.layout === 'steps') s.steps.forEach(function (r) { if (lvl(r) <= d) n++; }); });
    return n;
  }
  var depths = ['brief', 'medium', 'deep'];
  if (countAt(0) === countAt(1)) depths.splice(depths.indexOf('brief'), 1);
  if (countAt(1) === countAt(2)) depths.splice(depths.indexOf('deep'), 1);
  var startDepth = depthName(ALS.store.get('depth', null) || lesson.depth || 'medium');
  if (depths.indexOf(startDepth) < 0) startDepth = 'medium';

  var st = { i: 0, step: 0, notes: ALS.store.get('notes', false), more: ALS.store.get('more', false), depth: startDepth, overview: false, playing: false, timer: null, dir: 1 };
  var slides = [];
  function refilter() {
    var d = DEPTH[st.depth];
    slides = all.filter(function (s) { return lvl(s) <= d; });
    if (!slides.length) slides = all.slice();
  }
  refilter();
  function rows(s) { var d = DEPTH[st.depth]; return (s.steps || []).filter(function (r) { return lvl(r) <= d; }); }

  function rich(tag, text, cls) { var n = E(tag, { class: cls || '' }); ALS.rich(n, text); return n; }
  function inlineRich(tag, text, cls) { var n = E(tag, { class: cls || '' }); ALS.rich(n, text, { inline: true }); return n; }
  function stepEl(node) { node.classList.add('ls-step'); return node; }

  /* ---------- diagram engine shared by `diagram` and the visual components ---------- */
  function isDiagram(s) { return s.layout === 'diagram' || V.kinds.indexOf(s.layout) > -1; }
  function viz(s) {
    if (s._viz === undefined) {
      try { s._viz = V[s.layout](s); } catch (e) { s._viz = { svg: '', auto: [] }; }
    }
    return s._viz;
  }
  function dsteps(s) {
    if (s.steps && s.steps.length) return s.steps;
    return s.layout === 'diagram' ? [] : viz(s).auto;
  }
  function token(s, t) {
    var op = t.charAt(0) === '-' ? 'hide' : t.charAt(0) === '!' ? 'mark' : 'show', id = op === 'show' ? t : t.slice(1);
    return { op: op, ids: s.layout === 'grid' ? V.gridExpand(s, id) : [id] };
  }
  var ARROWS = '<defs>' + [['', 'line'], ['-accent', 'accent'], ['-accent2', 'accent2'], ['-muted', 'muted'], ['-good', 'good'], ['-bad', 'bad']].map(function (a) {
    return '<marker id="als-arrow' + a[0] + '" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="d-solid-' + a[1] + '" d="M0 0L10 5L0 10z"/></marker>';
  }).join('') + '</defs>';
  function prepSvg(src) {
    src = String(src || '');
    if (src.indexOf('url(#als-arrow') > -1) src = src.replace(/<svg\b[^>]*>/, function (m) { return m + ARROWS; });
    var svg = ALS.safeSvg(src);
    if (!svg) return null;
    $$('.ls-draw', svg).forEach(function (el) { if (!el.getAttribute('stroke-dasharray')) el.classList.add('ls-drawable'); });
    return svg;
  }
  function byId(svg, id) { return svg.querySelector('[id="' + String(id).replace(/["\\]/g, '') + '"]'); }

  function stepCount(s) {
    switch (s.layout) {
      case 'points': case 'summary': return s.points.length;
      case 'steps': return Math.max(1, (s.given ? 1 : 0) + rows(s).length + (s.result ? 1 : 0));
      case 'code': return Math.max(1, (s.highlight || []).length, (s.explain || []).length);
      case 'compare': return s.columns.length;
      case 'check': case 'recall': return 2;
      case 'timeline': return s.events.length;
      case 'definition': return s.example ? 2 : 1;
      case 'formula': return 1 + (s.parts || []).length;
      case 'table': return s.reveal === 'all' ? 1 : Math.max(1, s.rows.length);
      case 'pitfall': return s.why ? 3 : 2;
      case 'figure': return 1 + (s.marks || []).length;
      default: return isDiagram(s) ? Math.max(1, dsteps(s).length) : 1;
    }
  }
  /* number of → presses before the first .ls-step element appears */
  function lead(s) { return s.layout === 'definition' || s.layout === 'formula' || s.layout === 'recall' ? 1 : 0; }

  /* ---------- builders: each returns a node; steps are .ls-step elements in order ---------- */
  var build = {
    title: function (s) {
      return E('div', { class: 'ls-title' }, [
        s.kicker || lesson.module ? E('div', { class: 'als-kicker', text: s.kicker || lesson.module }) : null,
        E('h1', { class: 'als-h1', html: ALS.md(s.title || lesson.title, { inline: true }) }),
        s.subtitle || lesson.subtitle ? E('p', { class: 'als-sub', text: s.subtitle || lesson.subtitle }) : null,
        E('div', { class: 'ls-title-meta' }, [
          E('span', { class: 'als-chip', text: slides.length + ' ' + L.slides }),
          lesson.subject ? E('span', { class: 'als-chip als-chip--accent', text: lesson.subject }) : null,
          lesson.grounding === 'strict' ? E('span', { class: 'als-chip als-chip--good', text: L.strict }) : null,
          depths.length > 1 ? E('span', { class: 'als-chip', text: L.depth + ': ' + L[st.depth] }) : null,
          E('span', { class: 'als-chip', html: L.begin })
        ])
      ]);
    },
    points: function (s, summary) {
      var ul = E('ul', { class: 'ls-points ls-big' + (summary ? ' ls-summary' : '') });
      s.points.forEach(function (p, k) {
        var li = E('li', {}, [E('span', { class: 'n', text: summary ? '✓' : String(k + 1).padStart(2, '0') }), inlineRich('div', p)]);
        ul.appendChild(stepEl(li));
      });
      return ul;
    },
    summary: function (s) { return build.points(s, true); },
    steps: function (s) {
      var wrap = E('div', { class: 'ls-deriv' });
      if (s.given) wrap.appendChild(stepEl(rich('div', '**' + L.given + '.** ' + s.given, 'als-callout ls-given')));
      rows(s).forEach(function (row) {
        var r = E('div', { class: 'ls-deriv-row' });
        if (row.text) r.appendChild(inlineRich('div', row.text, 't'));
        if (row.math) { var m = E('div', { class: 'm' }); ALS.rich(m, '$$' + row.math + '$$'); r.appendChild(m); }
        if (row.why) r.appendChild(inlineRich('div', row.why, 'w'));
        wrap.appendChild(stepEl(r));
      });
      if (s.result) wrap.appendChild(stepEl(rich('div', '**' + L.result + '.** ' + s.result, 'als-callout als-callout--good ls-result')));
      return wrap;
    },
    diagram: function (s) {
      var box = E('div', { class: 'ls-svg' + (s.focus ? ' has-focus' : '') });
      var svg = prepSvg(s.layout === 'diagram' ? s.svg : viz(s).svg);
      if (svg) box.appendChild(svg); else box.appendChild(E('p', { class: 'als-muted', text: L.badSvg }));
      return E('div', { class: 'ls-diagram' }, [box, E('div', { class: 'ls-caption als-rich' })]);
    },
    figure: function (s) {
      var frame = E('div', { class: 'ls-fig-frame' }, [E('img', { src: s.image, alt: s.alt || s.title || '' })]);
      (s.marks || []).forEach(function (m, k) {
        frame.appendChild(E('div', { class: 'ls-fig-mark', style: 'left:' + (+m.x) + '%;top:' + (+m.y) + '%;width:' + (+m.w) + '%;height:' + (+m.h) + '%' },
          [E('span', { class: 'n', text: m.label || String(k + 1) })]));
      });
      return E('div', { class: 'ls-diagram' }, [E('div', { class: 'ls-fig' }, [frame]), E('div', { class: 'ls-caption als-rich' })]);
    },
    formula: function (s) {
      var f = E('div', { class: 'ls-formula' });
      ALS.rich(f, '$$' + s.formula + '$$');
      var parts = E('div', { class: 'ls-parts' });
      (s.parts || []).forEach(function (p) {
        var sym = E('div', { class: 'sym' });
        ALS.rich(sym, '$' + p.sym + '$', { inline: true });
        parts.appendChild(stepEl(E('div', { class: 'ls-part' }, [sym, inlineRich('div', p.means, 'means')])));
      });
      return E('div', {}, [f, parts, s.note ? rich('div', s.note, 'als-muted ls-formula-note') : null]);
    },
    table: function (s) {
      var t = E('table', { class: 'ls-table' });
      if (s.columns) t.appendChild(E('thead', {}, [E('tr', {}, s.columns.map(function (c) { return E('th', { html: ALS.md(c, { inline: true }) }); }))]));
      var body = E('tbody');
      s.rows.forEach(function (r) {
        var tr = E('tr', {}, r.map(function (c) { return inlineRich('td', String(c == null ? '' : c)); }));
        body.appendChild(s.reveal === 'all' ? tr : stepEl(tr));
      });
      t.appendChild(body);
      return E('div', { class: 'ls-table-wrap' }, [t]);
    },
    pitfall: function (s) {
      var kids = [stepEl(rich('div', '**' + L.mistake + '.** ' + s.wrong, 'als-callout als-callout--bad ls-big'))];
      if (s.why) kids.push(stepEl(rich('div', '**' + L.why + '.** ' + s.why, 'als-callout ls-big')));
      kids.push(stepEl(rich('div', '**' + L.correct + '.** ' + s.right, 'als-callout als-callout--good ls-big')));
      return E('div', { class: 'ls-pitfall' }, kids);
    },
    recall: function (s) {
      return E('div', {}, [E('div', { class: 'als-kicker', text: L.recall }), inlineRich('div', s.question, 'ls-big'),
        E('p', { class: 'als-muted ls-hint', text: L.recallHint }),
        stepEl(rich('div', '**' + L.answer + '.** ' + s.answer, 'als-callout als-callout--good ls-big'))]);
    },
    code: function (s) {
      var lines = ALS.highlight(s.code, s.lang);
      var pre = E('pre', { class: 'als-code' });
      lines.forEach(function (l, k) { pre.appendChild(E('span', { class: 'ln', 'data-line': String(k + 1), html: l })); });
      var kids = [E('div', {}, [s.lang ? E('div', { class: 'als-kicker', style: 'margin-bottom:.5rem', text: s.lang }) : null, pre])];
      var hasExplain = s.explain && s.explain.length;
      if (hasExplain) kids.push(E('div', { class: 'ls-explain als-rich' }));
      return E('div', { class: 'ls-code' + (hasExplain ? ' has-explain' : '') }, kids);
    },
    compare: function (s) {
      var g = E('div', { class: 'ls-compare' });
      s.columns.forEach(function (c) {
        var ul = E('ul'); c.points.forEach(function (p) { ul.appendChild(inlineRich('li', p)); });
        g.appendChild(stepEl(E('div', { class: 'als-card' }, [E('h3', { class: 'als-h3', html: ALS.md(c.heading, { inline: true }) }), ul])));
      });
      return g;
    },
    quote: function (s) {
      return E('figure', { style: 'margin:0' }, [
        E('blockquote', { class: 'ls-quote', html: ALS.md(s.quote, { inline: true }) }),
        s.by ? E('figcaption', { class: 'ls-quote-by', html: '— ' + ALS.md(s.by, { inline: true }) }) : null,
        s.comment ? rich('div', s.comment, 'ls-big als-muted') : null
      ]);
    },
    check: function (s) {
      var opts = E('div', { class: 'ls-options' });
      var fb = stepEl(E('div', { class: 'als-callout als-callout--info', style: 'margin-top:1rem' }));
      s.options.forEach(function (o, k) {
        opts.appendChild(E('button', {
          type: 'button', class: 'als-btn ls-option', 'data-k': String(k),
          html: '<span class="als-mono als-faint">' + String.fromCharCode(65 + k) + '</span>&nbsp;&nbsp;' + ALS.md(o, { inline: true }),
          onclick: function (e) { e.stopPropagation(); answerCheck(s, k); }
        }));
      });
      ALS.rich(fb, '**' + L.answer + ': ' + String.fromCharCode(65 + s.answer) + '.** ' + (s.explain || ''));
      return E('div', {}, [E('div', { class: 'als-kicker', text: L.check }), inlineRich('div', s.question, 'ls-big'), opts, fb]);
    },
    timeline: function (s) {
      var t = E('div', { class: 'ls-timeline' });
      s.events.forEach(function (ev) {
        t.appendChild(stepEl(E('div', { class: 'ls-event' }, [E('div', { class: 'when', text: ev.when }), inlineRich('div', ev.what, 'ls-big')])));
      });
      return t;
    },
    definition: function (s) {
      var kids = [E('div', { class: 'als-kicker', text: s.kind || L.definition }), E('div', { class: 'ls-term', html: ALS.md(s.term, { inline: true }) }), rich('div', s.definition, 'ls-def')];
      if (s.example) kids.push(stepEl(rich('div', '**' + L.example + '.** ' + s.example, 'als-callout ls-example')));
      return E('div', {}, kids);
    }
  };
  V.kinds.forEach(function (k) { build[k] = build.diagram; });

  function answerCheck(s, k) {
    var node = $('#ls-current');
    $$('.ls-option', node).forEach(function (b) {
      var bk = +b.getAttribute('data-k');
      b.classList.toggle('is-right', bk === s.answer);
      b.classList.toggle('is-wrong', bk === k && k !== s.answer);
      b.disabled = true;
    });
    st.step = 1; applySteps();
  }

  var OWN_HEAD = { title: 1, quote: 1, definition: 1, check: 1, recall: 1 };
  function slideNode(s, idx, forPrint) {
    var inner = E('div', { class: 'ls-inner' });
    if (!OWN_HEAD[s.layout]) {
      inner.appendChild(E('div', { class: 'als-kicker', style: 'margin-bottom:.5rem', text: (lesson.module ? lesson.module + ' · ' : '') + String(idx + 1).padStart(2, '0') }));
      if (s.title) inner.appendChild(E('h2', { class: 'als-h2', html: ALS.md(s.title, { inline: true }) }));
    }
    var b = build[s.layout] || build.points;
    inner.appendChild(b(s));
    var prov = ALS.provenance(s);
    if (prov) { prov.style.marginTop = '1.5rem'; inner.appendChild(prov); }
    return E('section', { class: 'ls-slide' + (forPrint ? ' ls-print-slide' : ''), 'aria-roledescription': 'slide', 'aria-label': 'Slide ' + (idx + 1) + ' of ' + slides.length }, [inner]);
  }

  /* ---------- step application ---------- */
  function applyDiagram(node, s) {
    var svg = node.querySelector('.ls-svg svg');
    var groups = dsteps(s);
    if (svg) {
      $$('.ls-drawable', svg).forEach(function (el) { // measured once the SVG is in the page
        if (el.style.getPropertyValue('--len')) return;
        try { el.style.setProperty('--len', String(Math.ceil(el.getTotalLength()) + 1)); } catch (e) { el.classList.remove('ls-drawable'); }
      });
      var first = {}, state = {}, cur = {}, mark = {};
      groups.forEach(function (g, k) {
        g.forEach(function (t) {
          var p = token(s, t);
          p.ids.forEach(function (id) {
            if (p.op === 'mark') { if (k === st.step) mark[id] = 1; return; }
            if (!(id in first)) first[id] = p.op;
            if (k <= st.step) state[id] = p.op === 'show';
            if (k === st.step && p.op === 'show') cur[id] = 1;
          });
        });
      });
      Object.keys(first).forEach(function (id) {
        var el = byId(svg, id);
        if (!el) return;
        var vis = id in state ? state[id] : first[id] !== 'show';
        el.classList.add('ls-svg-el');
        el.setAttribute('data-ls-hidden', vis ? '0' : '1');
        el.classList.toggle('is-current', !!cur[id]);
        el.classList.toggle('is-past', vis && !cur[id]);
      });
      $$('.is-mark', svg).forEach(function (el) { el.classList.remove('is-mark'); });
      Object.keys(mark).forEach(function (id) { var el = byId(svg, id); if (el) el.classList.add('is-mark'); });
    }
    var cap = $('.ls-caption', node);
    if (cap) ALS.rich(cap, (s.captions || [])[st.step] || s.caption || '');
  }

  function applySteps() {
    var node = $('#ls-current'); if (!node) return;
    var s = slides[st.i];
    var steps = $$('.ls-step', node);
    var showUpTo = s.layout === 'check' ? (st.step >= 1 ? steps.length : 0) : st.step + 1 - lead(s);
    steps.forEach(function (el, k) {
      el.classList.toggle('is-hidden', k >= showUpTo);
      el.classList.toggle('is-current', k === showUpTo - 1);
      el.classList.toggle('is-past', s.layout === 'steps' && k < showUpTo - 1);
    });
    if (s.layout === 'check' && st.step >= 1) {
      $$('.ls-option', node).forEach(function (b) { b.disabled = true; if (+b.getAttribute('data-k') === s.answer) b.classList.add('is-right'); });
    }
    if (isDiagram(s)) applyDiagram(node, s);
    if (s.layout === 'figure') {
      var marks = s.marks || [];
      $$('.ls-fig-mark', node).forEach(function (m, k) {
        m.classList.toggle('is-off', k > st.step - 1);
        m.classList.toggle('is-current', k === st.step - 1);
        m.classList.toggle('is-past', k < st.step - 1);
      });
      var fc = $('.ls-caption', node), mk = marks[st.step - 1];
      if (fc) ALS.rich(fc, mk ? '**' + (mk.label || st.step) + '.** ' + (mk.text || '') : (s.caption || ''));
    }
    if (s.layout === 'code') {
      var pre = $('.als-code', node);
      var hl = (s.highlight || [])[st.step];
      $$('.ln', pre).forEach(function (ln) { ln.classList.toggle('is-focus', !!hl && hl.indexOf(+ln.getAttribute('data-line')) > -1); });
      pre.classList.toggle('has-focus', !!(hl && hl.length));
      var ex = $('.ls-explain', node);
      if (ex) ALS.rich(ex, (s.explain || [])[st.step] || '');
    }
    var total = slides.reduce(function (a, x) { return a + stepCount(x); }, 0);
    var done = slides.slice(0, st.i).reduce(function (a, x) { return a + stepCount(x); }, 0) + st.step + 1;
    var bar = $('.ls-progress span'); if (bar) bar.style.width = (done / total * 100) + '%';
    var cnt = $('.ls-count'); if (cnt) cnt.textContent = String(st.i + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
    ALS.renderMath(node);
  }

  function go(i, step, dir) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    var changed = i !== st.i || !$('#ls-current');
    st.i = i; st.step = step == null ? 0 : step; st.dir = dir || 1;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { /* file:// in some browsers */ }
    if (changed || st.overview) { st.overview = false; renderStage(true); } else applySteps();
    ALS.store.set('pos', i);
  }
  function next() {
    var s = slides[st.i];
    if (st.step < stepCount(s) - 1) { st.step++; applySteps(); }
    else if (st.i < slides.length - 1) go(st.i + 1, 0, 1);
    else stopPlay();
  }
  function prev() {
    if (st.step > 0) { st.step--; applySteps(); }
    else if (st.i > 0) go(st.i - 1, stepCount(slides[st.i - 1]) - 1, -1);
  }
  function stopPlay() { st.playing = false; clearInterval(st.timer); var b = $('#ls-play'); if (b) b.innerHTML = ALS.icon('play'); }
  function togglePlay() {
    if (st.playing) return stopPlay();
    st.playing = true; $('#ls-play').innerHTML = ALS.icon('pause');
    st.timer = setInterval(next, (lesson.autoplaySec || 4) * 1000);
  }

  /* ---------- rendering ---------- */
  function renderStage(animate) {
    var stage = $('#ls-stage');
    stage.innerHTML = '';
    var notes = $('#ls-notes'), more = $('#ls-more'), moreBtn = $('#ls-more-btn');
    if (st.overview) {
      if (notes) notes.hidden = true;
      if (more) more.hidden = true;
      var grid = E('div', { class: 'ls-overview' });
      slides.forEach(function (s, k) {
        grid.appendChild(E('button', { type: 'button', class: 'als-card ls-thumb', 'aria-current': String(k === st.i), onclick: function () { st.overview = false; go(k, 0, 1); } }, [
          E('span', { class: 'n', text: String(k + 1).padStart(2, '0') + ' · ' + s.layout }),
          E('span', { class: 't', html: ALS.md(s.title || s.term || s.question || s.quote || (s.formula ? '$' + s.formula + '$' : '') || lesson.title, { inline: true }) }),
          s.level && s.level !== 'core' ? E('span', { class: 'ls-level', text: L[s.level] || s.level }) : null
        ]));
      });
      stage.appendChild(grid);
      ALS.renderMath(grid);
      return;
    }
    var cur = slides[st.i];
    var node = slideNode(cur, st.i);
    node.id = 'ls-current';
    if (animate) node.classList.add(st.dir < 0 ? 'ls-anim-back' : 'ls-anim-in');
    stage.appendChild(node);
    if (notes) {
      notes.hidden = !(st.notes && cur.notes);
      if (cur.notes) ALS.rich(notes, '**' + L.notes + '.** ' + cur.notes);
    }
    if (more) {
      more.hidden = !(st.more && cur.more);
      if (cur.more) ALS.rich(more, '**' + L.more + '.** ' + cur.more);
    }
    if (moreBtn) { moreBtn.hidden = !cur.more; moreBtn.setAttribute('aria-pressed', String(!!st.more)); }
    applySteps();
  }

  function depthLabel() { return L.depth + ': ' + L[st.depth]; }
  function setDepth(d) {
    var cur = slides[st.i], at = all.indexOf(cur);
    st.depth = d; ALS.store.set('depth', d); refilter();
    var k = slides.indexOf(cur);
    if (k < 0) { k = 0; slides.forEach(function (s, j) { if (all.indexOf(s) <= at) k = j; }); }
    st.i = k; st.step = 0; st.overview = false;
    var b = $('#ls-depth'); if (b) b.textContent = depthLabel();
    renderStage(true);
    ALS.toast(depthLabel() + ' · ' + slides.length + ' ' + L.slides);
  }
  function cycleDepth() {
    if (depths.length < 2) return ALS.toast(L.oneDepth);
    setDepth(depths[(depths.indexOf(st.depth) + 1) % depths.length]);
  }

  function render() {
    app.innerHTML = '';
    app.appendChild(E('div', { class: 'ls-progress als-noprint' }, [E('span')]));
    app.appendChild(ALS.topbar([
      ALS.iconBtn('print', 'Print or save as PDF (all steps revealed)', printAll, 'als-noprint')
    ]));
    var main = E('main', { class: 'als-shell' }, [E('div', { id: 'ls-stage', class: 'ls-stage' })]);
    app.appendChild(main);
    app.appendChild(E('div', { class: 'als-shell' }, [
      E('div', { id: 'ls-more', class: 'ls-more als-callout als-callout--info als-rich', hidden: true }),
      E('div', { id: 'ls-notes', class: 'ls-notes als-callout als-rich', hidden: true })
    ]));
    var bottom = E('nav', { class: 'ls-bottom als-noprint', 'aria-label': 'Lesson controls' }, [E('div', { class: 'als-shell' }, [
      ALS.iconBtn('left', 'Previous (←)', prev),
      ALS.iconBtn('right', 'Next (→ or Space)', next),
      E('span', { class: 'ls-count' }),
      E('div', { class: 'als-spacer' }),
      depths.length > 1 ? E('button', { type: 'button', id: 'ls-depth', class: 'als-btn als-btn--ghost als-btn--sm', title: 'Change depth (D)', text: depthLabel(), onclick: cycleDepth }) : null,
      (function () { var b = ALS.iconBtn('bulb', 'More detail on this slide (E)', toggleMore); b.id = 'ls-more-btn'; b.hidden = true; return b; })(),
      (function () { var b = ALS.iconBtn('play', 'Autoplay (P)', togglePlay); b.id = 'ls-play'; return b; })(),
      ALS.iconBtn('notes', 'Speaker notes (N)', toggleNotes),
      ALS.iconBtn('grid', 'Overview (O)', toggleOverview),
      ALS.iconBtn('expand', 'Full screen (F)', fullscreen)
    ])]);
    app.appendChild(bottom);
    renderStage(false);
  }

  function toggleNotes() { st.notes = !st.notes; ALS.store.set('notes', st.notes); renderStage(false); if (st.notes && !slides[st.i].notes) ALS.toast(L.noNotes); }
  function toggleMore() { st.more = !st.more; ALS.store.set('more', st.more); var keep = st.step; renderStage(false); st.step = keep; applySteps(); if (st.more && !slides[st.i].more) ALS.toast(L.noMore); }
  function toggleOverview() { st.overview = !st.overview; renderStage(true); }
  function fullscreen() {
    try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
    catch (e) { ALS.toast('Full screen is not available here'); }
  }
  function printAll() {
    var stage = $('#ls-stage');
    var withMore = st.more || new URLSearchParams(location.search).get('more') === '1';
    stage.innerHTML = '';
    slides.forEach(function (s, k) {
      var n = slideNode(s, k, true);
      stage.appendChild(n);
      var cap = $('.ls-caption', n);
      if (cap && isDiagram(s)) ALS.rich(cap, (s.captions || [s.caption || '']).join(' '));
      if (cap && s.layout === 'figure') {
        ALS.rich(cap, [s.caption || ''].concat((s.marks || []).map(function (m, j) { return '**' + (m.label || j + 1) + '.** ' + (m.text || ''); })).join('\n\n'));
      }
      if (s.layout === 'code' && s.explain) { var ex = $('.ls-explain', n); if (ex) ALS.rich(ex, s.explain.join('\n\n')); }
      if (withMore && s.more) $('.ls-inner', n).appendChild(rich('div', '**' + L.more + '.** ' + s.more, 'als-callout als-callout--info ls-more'));
    });
    ALS.renderMath(stage);
    if (new URLSearchParams(location.search).get('print') === '1') return; // headless PDF: leave everything revealed
    setTimeout(function () { window.print(); renderStage(false); }, 250);
  }

  ALS.onKey({
    'ArrowRight': next, ' ': next, 'PageDown': next, 'Enter': next,
    'ArrowLeft': prev, 'PageUp': prev, 'Backspace': prev,
    'Home': function () { go(0, 0, -1); }, 'End': function () { go(slides.length - 1, 0, 1); },
    'n': toggleNotes, 'N': toggleNotes, 'o': toggleOverview, 'O': toggleOverview,
    'f': fullscreen, 'F': fullscreen, 'p': togglePlay, 'P': togglePlay,
    'd': cycleDepth, 'D': cycleDepth, 'e': toggleMore, 'E': toggleMore,
    'Escape': function () { if (st.overview) toggleOverview(); }
  });

  // touch swipe
  var tx = null;
  document.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (tx == null) return;
    var dx = e.changedTouches[0].clientX - tx; tx = null;
    if (Math.abs(dx) > 50) { if (dx < 0) next(); else prev(); }
  });

  window.addEventListener('hashchange', function () {
    var h = parseInt((location.hash || '').slice(1), 10);
    if (!isNaN(h) && h - 1 !== st.i) go(h - 1, 0, h - 1 > st.i ? 1 : -1);
  });

  var params = new URLSearchParams(location.search);
  var askedDepth = depthName(params.get('depth'));
  if (depths.indexOf(askedDepth) > -1) { st.depth = askedDepth; refilter(); }
  var start = parseInt((location.hash || '').slice(1), 10);
  st.i = isNaN(start) ? 0 : Math.max(0, Math.min(slides.length - 1, start - 1));
  render();
  if (params.get('print') === '1') printAll();
});
</script>
</body>
</html>
